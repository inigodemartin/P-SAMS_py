<script>
(function () {
  const G = JSON.parse(document.getElementById('graph').textContent);
  const NODES = new Map(G.nodes.map(n => [n.id, n]));
  const MODS = new Map((G.modules || []).map(m => [m.id, m]));
  const VARS = G.variants || [];
  const $ = s => document.querySelector(s);
  const NS = 'http://www.w3.org/2000/svg';
  const el = (t, a = {}, p) => { const e = document.createElementNS(NS, t); for (const k in a) if (a[k] != null) e.setAttribute(k, a[k]); if (p) p.appendChild(e); return e; };
  const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const state = { mode: {}, sel: null, query: '', helpers: false, inter: true };
  for (const v of VARS) state.mode[v.id] = (v.options.find(o => o.default) || v.options[0]).id;

  /* mutually exclusive options: option A of variant V excludes option B of variant W,
     and the rule is applied in both directions so the selectors can never offer a
     combination the command line would reject. */
  const optOf = (vid, oid) => { const v = VARS.find(x => x.id === vid); return v && v.options.find(o => o.id === oid); };
  const clash = (aVid, aOid, bVid, bOid) => {
    const a = optOf(aVid, aOid), b = optOf(bVid, bOid);
    const hit = (o, vid, oid) => { const ex = o && o.excludes && o.excludes[vid]; return !!ex && (Array.isArray(ex) ? ex : [ex]).includes(oid); };
    return hit(a, bVid, bOid) || hit(b, aVid, aOid);
  };
  const allowed = (vid, oid) => VARS.every(w => w.id === vid || !clash(vid, oid, w.id, state.mode[w.id]));
  let adjusted = [];
  /* Choosing an option the command line could not combine with the current
     selection moves the other variants rather than blocking the click, so
     every valid route is one click away; what moved is said out loud. */
  function setMode(vid, oid) {
    state.mode[vid] = oid;
    adjusted = [];
    for (const w of VARS) {
      if (w.id === vid) continue;
      if (clash(vid, oid, w.id, state.mode[w.id])) {
        const ok = w.options.find(o => !clash(vid, oid, w.id, o.id));
        if (ok) { state.mode[w.id] = ok.id; adjusted.push(`${w.label} → ${ok.label}`); }
      }
    }
    syncButtons();
  }
  function syncButtons() {
    document.querySelectorAll('.seg button').forEach(b => {
      b.setAttribute('aria-pressed', String(state.mode[b.dataset.v] === b.dataset.o));
      const o = optOf(b.dataset.v, b.dataset.o);
      const ok = allowed(b.dataset.v, b.dataset.o);
      b.classList.toggle('adjusts', !ok && state.mode[b.dataset.v] !== b.dataset.o);
      b.title = (o && o.description) || '';
    });
    const msg = document.getElementById('adjusted');
    if (msg) msg.textContent = adjusted.length ? 'Adjusted to keep the route runnable: ' + adjusted.join(', ') + '.' : '';
  }

  /* ── geometry constants ─────────────────────────────────────────────── */
  const W = 900, PAD = 44, GAPY = 40, GAPX = 28, SECT = 48, BANDW = 620;
  const MAXW = 430, MINW = 230, PADX = 16;
  const SANS = (getComputedStyle(document.documentElement).getPropertyValue('--sans') || 'sans-serif').trim();
  const MONO = (getComputedStyle(document.documentElement).getPropertyValue('--mono') || 'monospace').trim();
  const F = { t: ['600 13px', SANS], td: ['600 14px', SANS], s: ['400 11px', MONO], tool: ['400 10.5px', MONO],
              band: ['600 11.5px', SANS], cell: ['400 10.5px', MONO], note: ['500 11px', SANS], sect: ['500 11px', MONO] };

  /* Text is measured with the real font on a canvas, never estimated per
     character, so boxes fit what they hold and the page re-lays itself out
     once the web fonts arrive. */
  const ctx = document.createElement('canvas').getContext('2d');
  const textW = (s, f) => { ctx.font = `${f[0]} ${f[1]}`; return ctx.measureText(String(s)).width; };
  const truncate = (s, maxPx, f) => {
    s = String(s ?? '');
    if (textW(s, f) <= maxPx) return s;
    let lo = 0, hi = s.length;
    while (lo < hi) { const mid = (lo + hi + 1) >> 1; if (textW(s.slice(0, mid) + '…', f) <= maxPx) lo = mid; else hi = mid - 1; }
    return s.slice(0, lo) + '…';
  };
  const wrapText = (text, maxPx, f) => {
    const lines = []; let cur = '';
    const push = () => { if (cur) lines.push(cur); cur = ''; };
    for (let w of String(text ?? '').split(/\s+/).filter(Boolean)) {
      while (textW(w, f) > maxPx) {                     // a single word wider than the box: split it
        let k = w.length; while (k > 1 && textW(w.slice(0, k), f) > maxPx) k--;
        if (cur) push();
        lines.push(w.slice(0, k)); w = w.slice(k);
      }
      if (!cur) cur = w;
      else if (textW(cur + ' ' + w, f) <= maxPx) cur += ' ' + w;
      else { push(); cur = w; }
    }
    push();
    return lines.length ? lines : [''];
  };

  /* ── visibility ─────────────────────────────────────────────────────── */
  const whenOk = w => {
    if (!w) return true;
    for (const k in w) {
      const want = Array.isArray(w[k]) ? w[k] : [w[k]];
      if (!want.includes(state.mode[k])) return false;
    }
    return true;
  };
  const nodeVisible = n => whenOk(n.when)
    && (state.helpers || !n.helper)
    && (state.inter || !(n.kind === 'data' && n.role === 'intermediate'))
    && (!n.module || !MODS.get(n.module) || whenOk(MODS.get(n.module).when));
  const fanoutOn = n => {
    if (!n.fanout) return false;
    const v = VARS.find(x => x.id === n.fanout.variant);
    if (!v) return false;
    const o = v.options.find(x => x.id === state.mode[v.id]);
    return !!(o && o.fanout);
  };

  /* ── layout ─────────────────────────────────────────────────────────── */
  /* Size of a node when it may be at most maxW wide: the title wraps to the
     width, the symbol and tool lines are cut with an ellipsis (the full text
     stays in the tooltip and the side panel). */
  function measure(n, maxW = MAXW) {
    if (fanoutOn(n)) {
      const noteLines = n.fanout.note ? wrapText(n.fanout.note, BANDW - 40, F.note) : [];
      return { w: BANDW, h: 96 + (noteLines.length ? 6 + noteLines.length * 15 : 0), noteLines };
    }
    const tf = n.kind === 'decision' ? F.td : F.t;
    const inner = Math.max(40, maxW - 2 * PADX);
    const titleLines = wrapText(n.label, inner, tf);
    const subFull = n.sublabel || n.file || '';
    const toolFull = (n.tools || []).join(' · ');
    const widest = Math.max(...titleLines.map(l => textW(l, tf)),
      Math.min(inner, subFull ? textW(subFull, F.s) : 0),
      Math.min(inner, toolFull ? textW(toolFull, F.tool) : 0));
    const w = Math.min(maxW, Math.max(Math.min(MINW, maxW), Math.ceil(widest) + 2 * PADX));
    const sub = subFull ? truncate(subFull, w - 2 * PADX + 6, F.s) : '';
    const tool = toolFull ? truncate(toolFull, w - 2 * PADX + 6, F.tool) : '';
    const block = titleLines.length * 17 + (sub ? 15 : 0) + (tool ? 15 : 0);
    return { w, h: Math.max(46, block + 26), titleLines, sub, tool, block };
  }

  /* Edges of the chosen route, with any node hidden by a filter bypassed:
     hiding intermediate data must shorten the chain, not cut it in two. */
  function routeEdges() {
    const vis = new Set(G.nodes.filter(nodeVisible).map(n => n.id));
    const live = (G.edges || []).filter(e => whenOk(e.when) && (state.helpers || e.kind !== 'call'));
    const out = new Map(), inn = new Map();
    for (const e of live) {
      if (!out.has(e.from)) out.set(e.from, []);
      if (!inn.has(e.to)) inn.set(e.to, []);
      out.get(e.from).push(e); inn.get(e.to).push(e);
    }
    const seen = new Set(), res = [];
    const add = (from, to, e) => {
      const k = `${from}>${to}|${e.kind || 'data'}`;
      if (from === to || seen.has(k)) return;
      seen.add(k);
      res.push({ from, to, kind: e.kind, label: e.label, branch: e.branch });
    };
    const walk = (from, e, hops, guard) => {
      if (vis.has(e.to)) { add(from, e.to, hops ? { kind: e.kind, branch: e.branch } : e); return; }
      if (guard.has(e.to) || guard.size > 60) return;
      guard.add(e.to);
      for (const nx of (out.get(e.to) || [])) walk(from, nx, hops + 1, guard);
    };
    for (const e of live) {
      if (!vis.has(e.from)) continue;
      walk(e.from, e, 0, new Set([e.from]));
    }
    return res;
  }

  function layout() {
    const vis = G.nodes.filter(nodeVisible);
    const edges = routeEdges();
    const flow = edges.filter(e => e.kind !== 'call');

    // longest-path layering over flow edges (cycle-safe)
    const layer = new Map(vis.map(n => [n.id, 0]));
    const inc = new Map(vis.map(n => [n.id, []]));
    for (const e of flow) inc.get(e.to).push(e.from);
    const order = vis.map(n => n.id);
    for (let pass = 0; pass < Math.min(order.length, 40); pass++) {
      let moved = false;
      for (const id of order) {
        const want = Math.max(0, ...inc.get(id).map(p => layer.get(p) + 1));
        if (want > layer.get(id)) { layer.set(id, want); moved = true; }
      }
      if (!moved) break;
    }

    /* Stages must not interleave: a node's row is ordered first by the stage it
       belongs to, then by its depth in the flow. A node with no stage inherits
       the stage of whatever feeds it. */
    const modRank = new Map((G.modules || []).map((m, i) => [m.id, i]));
    const rankOf = new Map();
    const rank = (id, guard) => {
      if (rankOf.has(id)) return rankOf.get(id);
      const n = NODES.get(id);
      let r = n && n.module && modRank.has(n.module) ? modRank.get(n.module) : null;
      if (r == null) {
        const ps = inc.get(id) || [];
        const up = ps.filter(q => !guard.has(q)).map(q => { guard.add(q); return rank(q, guard); })
                     .filter(v => v != null);
        r = up.length ? Math.max(...up) : -1;
      }
      rankOf.set(id, r);
      return r;
    };
    for (const n of vis) rank(n.id, new Set([n.id]));
    const key = n => rankOf.get(n.id) * 1000 + layer.get(n.id);
    const keys = [...new Set(vis.map(key))].sort((a, b) => a - b);
    const slot = new Map(keys.map((k, i) => [k, i]));
    const rows = [];
    for (const n of vis) (rows[slot.get(key(n))] ||= []).push(n);
    // order inside a row by the average position of its predecessors
    const pos = new Map(vis.map((n, i) => [n.id, i]));
    for (let r = 1; r < rows.length; r++) {
      rows[r].sort((a, b) => {
        const bc = n => { const ps = inc.get(n.id); return ps.length ? ps.reduce((s, p) => s + (pos.get(p) ?? 0), 0) / ps.length : pos.get(n.id); };
        return bc(a) - bc(b);
      });
      rows[r].forEach((n, i) => pos.set(n.id, i));
    }

    // place: a row that would be wider than the page is re-measured with a
    // narrower limit per box, so titles re-wrap instead of spilling out.
    const box = new Map();
    let y = PAD;
    const sections = [], seenMod = new Set();
    const avail = W - 2 * PAD;
    for (const row of rows) {
      if (!row) continue;
      const mod = row[0].module && MODS.has(row[0].module) ? row[0].module : null;
      if (mod && !seenMod.has(mod)) { seenMod.add(mod); sections.push({ id: mod, y }); y += SECT; }
      const gaps = GAPX * (row.length - 1);
      let sizes = row.map(n => measure(n));
      let total = sizes.reduce((s, z) => s + z.w, 0);
      if (total + gaps > avail) {
        const scale = (avail - gaps) / total;
        sizes = row.map((n, i) => measure(n, Math.max(150, Math.floor(sizes[i].w * scale))));
        total = sizes.reduce((s, z) => s + z.w, 0);
        if (total + gaps > avail) {                     // floor hit: share the width evenly
          const each = Math.max(80, Math.floor((avail - gaps) / row.length));
          sizes = row.map(n => measure(n, each));
          total = sizes.reduce((s, z) => s + z.w, 0);
        }
      }
      let x = (W - total - gaps) / 2;
      const rowH = Math.max(...sizes.map(z => z.h));
      row.forEach((n, i) => {
        box.set(n.id, { x, y, w: sizes[i].w, h: sizes[i].h, rb: y + rowH, m: sizes[i], node: n });
        x += sizes[i].w + GAPX;
      });
      y += rowH + GAPY;
    }
    const depth = new Map(vis.map(n => [n.id, slot.get(key(n))]));
    return { box, edges, rows, sections, height: y - GAPY + PAD, layer: depth };
  }

  /* ── drawing ────────────────────────────────────────────────────────── */
  function drawNode(b, parent) {
    const n = b.node, m = b.m;
    const cls = ['node', n.kind, n.kind === 'data' ? (n.role || '') : '', n.helper ? 'helper' : ''].filter(Boolean).join(' ');
    const g = el('g', { class: cls, transform: `translate(${b.x},${b.y})`, 'data-id': n.id }, parent);
    const t = el('title', {}, g); t.textContent = n.description || n.label;

    if (fanoutOn(n)) {
      g.classList.add('band');
      el('rect', { class: 'bg box', width: b.w, height: b.h, rx: 8 }, g);
      el('text', { class: 't', x: b.w / 2, y: 24, 'text-anchor': 'middle' }, g).textContent = truncate(n.label, b.w - 32, F.t);
      const items = [`${n.fanout.item} 1`, `${n.fanout.item} 2`, `${n.fanout.item} N`];
      const cw = (b.w - 4 * 16) / 3;
      items.forEach((it, i) => {
        const cx = 16 + i * (cw + 16);
        el('rect', { class: 'cell', x: cx, y: 36, width: cw, height: 46, rx: 5 }, g);
        el('text', { class: 't', x: cx + cw / 2, y: 54, 'text-anchor': 'middle', 'font-size': 11.5 }, g).textContent = truncate(it, cw - 12, F.band);
        if (n.fanout.detail) el('text', { class: 's', x: cx + cw / 2, y: 71, 'text-anchor': 'middle', 'font-size': 10.5 }, g).textContent = truncate(n.fanout.detail, cw - 12, F.cell);
      });
      (m.noteLines || []).forEach((ln, i) =>
        el('text', { class: `note ${n.fanout.note_kind === 'fail' ? 'fail' : 'muted'}`, x: b.w / 2, y: 102 + i * 15, 'text-anchor': 'middle' }, g).textContent = ln);
      return g;
    }

    const rx = n.kind === 'data' ? 4 : 7;
    el('rect', { class: 'box', width: b.w, height: b.h, rx }, g);
    const lines = m.titleLines || [n.label];
    let ty = (b.h - m.block) / 2 + 13;                   // text block centred vertically
    lines.forEach(ln => { el('text', { class: 't', x: b.w / 2, y: ty, 'text-anchor': 'middle', 'font-size': n.kind === 'decision' ? 14 : 13 }, g).textContent = ln; ty += 17; });
    if (m.sub) { el('text', { class: 's', x: b.w / 2, y: ty - 1, 'text-anchor': 'middle' }, g).textContent = m.sub; ty += 15; }
    if (m.tool) el('text', { class: 'tool', x: b.w / 2, y: ty - 1, 'text-anchor': 'middle' }, g).textContent = m.tool;
    return g;
  }

  /* Adjacent rows: straight down, or a dog-leg whose horizontal run sits in
     the gap below the whole source row, so it never crosses a taller sibling.
     Any other edge leaves below its row, travels in a lane outside the page
     margin, and comes back in just above the target, under any stage heading. */
  function route(a, b, lane) {
    const x1 = a.x + a.w / 2, y1 = a.y + a.h, x2 = b.x + b.w / 2, y2 = b.y, end = y2 - 7;
    if (lane == null) {
      if (Math.abs(x1 - x2) < 1.5) return `M${x1},${y1} L${x2},${end}`;
      const my = a.rb + GAPY / 2;
      return `M${x1},${y1} L${x1},${my} L${x2},${my} L${x2},${end}`;
    }
    const ey = a.rb + GAPY - 12, ay = y2 - 12;
    return `M${x1},${y1} L${x1},${ey} L${lane},${ey} L${lane},${ay} L${x2},${ay} L${x2},${end}`;
  }

  function render() {
    const L = layout();
    const svg = $('#svg'), root = $('#root');
    root.innerHTML = '';
    svg.setAttribute('viewBox', `0 0 ${W} ${Math.max(200, L.height)}`);
    svg.setAttribute('aria-label', `Flow diagram of ${G.pipeline.name}: ${L.box.size} steps on the selected route.`);
    let defs = svg.querySelector('defs');
    if (!defs) {
      defs = el('defs', {}, svg);
      for (const [id, col] of [['ah', 'var(--fg)'], ['ah-yes', 'var(--pass)'], ['ah-no', 'var(--fail)'], ['ah-call', 'var(--muted)']]) {
        const m = el('marker', { id, viewBox: '0 0 10 10', refX: 9, refY: 5, markerWidth: 7, markerHeight: 7, orient: 'auto-start-reverse' }, defs);
        el('path', { d: 'M0,0 L10,5 L0,10 z', fill: col, 'fill-opacity': id === 'ah' ? .55 : (id === 'ah-call' ? .35 : 1) }, m);
      }
    }
    const eg = el('g', { id: 'edges' }, root), ng = el('g', { id: 'nodes' }, root), sg = el('g', { id: 'sects' }, root);

    for (const s of L.sections) {
      const m = MODS.get(s.id), g = el('g', { class: 'sect', 'data-mod': s.id }, sg);
      const label = m.label.toUpperCase();
      el('text', { x: PAD, y: s.y + 14 }, g).textContent = label;
      const tw = textW(label, F.sect) + label.length * 11 * 0.09;       // + letter-spacing
      el('line', { x1: PAD + tw + 12, y1: s.y + 10, x2: W - PAD, y2: s.y + 10 }, g);
      const tt = el('title', {}, g); tt.textContent = m.description || m.label;
    }

    /* Lanes: every long-range edge leaving one node travels down the same
       lane, so a dataset consumed by several later steps reads as one bus
       with a tap per consumer. Sides are balanced; each extra source on a
       side moves 8 units further out. */
    const lanes = { L: new Map(), R: new Map() };
    const laneX = (a, b) => {
      const id = a.node.id;
      let side = lanes.L.has(id) ? 'L' : lanes.R.has(id) ? 'R' : null;
      if (!side) {
        const cx = (a.x + a.w / 2 + b.x + b.w / 2) / 2;
        side = cx < W / 2 - 40 ? 'L' : cx > W / 2 + 40 ? 'R' : (lanes.L.size <= lanes.R.size ? 'L' : 'R');
        lanes[side].set(id, lanes[side].size);
      }
      const k = lanes[side].get(id) % 4;
      return side === 'L' ? PAD - 14 - k * 8 : W - PAD + 14 + k * 8;
    };
    /* Labels sit beside the vertical run leaving the source, on the side the
       edge then turns to (a straight edge takes the side its siblings leave
       free), above the level of any horizontal run. The same text is written
       once per source (one "tidy" per bus); a label that would overlap one
       already placed moves to the far side of the line, or is dropped. */
    const placed = [], said = new Set();
    const outDir = new Map();
    for (const e of L.edges) {
      const a = L.box.get(e.from), b = L.box.get(e.to);
      if (!a || !b) continue;
      const dx = (b.x + b.w / 2) - (a.x + a.w / 2);
      if (Math.abs(dx) >= 1.5) (outDir.get(e.from) || outDir.set(e.from, { L: 0, R: 0 }).get(e.from))[dx < 0 ? 'L' : 'R']++;
    }
    const placeLabel = (g, a, b, lane, label) => {
      const key = `${a.node.id}|${label}`;
      if (said.has(key)) return;
      const x1 = a.x + a.w / 2, x2 = b.x + b.w / 2, y = a.rb + GAPY / 2 - 6, lw = textW(label, F.s), lh = 12;
      const sib = outDir.get(a.node.id) || { L: 0, R: 0 };
      const toward = lane != null ? (lane < x1 ? 'L' : 'R')
        : Math.abs(x2 - x1) < 1.5 ? (sib.R > sib.L ? 'L' : 'R')
        : (x2 < x1 ? 'L' : 'R');
      for (const side of toward === 'L' ? ['L', 'R'] : ['R', 'L']) {
        const r = { x: side === 'L' ? x1 - 7 - lw : x1 + 7, y: y - lh + 2, w: lw, h: lh };
        if (placed.some(q => r.x < q.x + q.w + 4 && q.x < r.x + r.w + 4 && r.y < q.y + q.h && q.y < r.y + r.h)) continue;
        placed.push(r); said.add(key);
        el('text', { x: side === 'L' ? x1 - 7 : x1 + 7, y, 'text-anchor': side === 'L' ? 'end' : 'start' }, g).textContent = label;
        return;
      }
    };
    for (const e of L.edges) {
      const a = L.box.get(e.from), b = L.box.get(e.to);
      if (!a || !b) continue;
      const span = L.layer.get(e.to) - L.layer.get(e.from);
      const lane = (span !== 1 || b.y < a.y) ? laneX(a, b) : null;   // same row, or backwards: never a dog-leg through the row
      const cls = `edge ${e.kind === 'call' ? 'call' : ''} ${e.branch || ''} ${lane != null ? 'far' : ''}`.replace(/\s+/g, ' ').trim();
      const g = el('g', { class: cls, 'data-from': e.from, 'data-to': e.to }, eg);
      const mk = e.branch === 'yes' ? 'ah-yes' : e.branch === 'no' ? 'ah-no' : e.kind === 'call' ? 'ah-call' : 'ah';
      el('path', { d: route(a, b, lane), 'marker-end': `url(#${mk})` }, g);
      if (e.label) placeLabel(g, a, b, lane, truncate(e.label, 140, F.s));
    }

    for (const b of L.box.values()) {
      const g = drawNode(b, ng);
      g.addEventListener('click', ev => { ev.stopPropagation(); select(b.node.id); });
    }

    $('#count').textContent = `${L.box.size} step${L.box.size === 1 ? '' : 's'} on this route`;
    applyMarks();
    return L;
  }

  /* ── highlighting ───────────────────────────────────────────────────── */
  function reach(id) {
    const vis = new Set(G.nodes.filter(nodeVisible).map(n => n.id));
    const set = new Set([id]);
    for (const dir of ['up', 'down']) {
      let grow = true;
      while (grow) {
        grow = false;
        for (const e of G.edges) {
          if (!whenOk(e.when)) continue;
          const [a, b] = dir === 'up' ? [e.to, e.from] : [e.from, e.to];
          if (set.has(a) && vis.has(b) && !set.has(b)) { set.add(b); grow = true; }
        }
      }
    }
    return set;
  }
  function applyMarks() {
    const root = $('#root');
    root.querySelectorAll('.node, .edge').forEach(g => g.classList.remove('dim', 'sel', 'hit'));
    if (state.query) {
      const q = state.query;
      const m = n => [n.label, n.sublabel, n.file, n.description, n.signature, ...(n.tools || [])].some(s => s && String(s).toLowerCase().includes(q));
      root.querySelectorAll('.node').forEach(g => { const n = NODES.get(g.dataset.id); if (n && m(n)) g.classList.add('hit'); else g.classList.add('dim'); });
      root.querySelectorAll('.edge').forEach(g => g.classList.add('dim'));
      return;
    }
    if (!state.sel) return;
    const keep = reach(state.sel);
    root.querySelectorAll('.node').forEach(g => {
      if (!keep.has(g.dataset.id)) g.classList.add('dim');
      else if (g.dataset.id !== state.sel) g.classList.add('lit');
      if (g.dataset.id === state.sel) g.classList.add('sel');
    });
    root.querySelectorAll('.edge').forEach(g => {
      const on = keep.has(g.dataset.from) && keep.has(g.dataset.to);
      g.classList.add(on ? 'lit' : 'dim');
    });
  }

  /* ── drawer ─────────────────────────────────────────────────────────── */
  const drawer = $('#drawer'), body = $('#drawer-body');
  const linkTo = id => { const n = NODES.get(id); return n ? `<li><a data-go="${esc(id)}">${esc(n.label)}</a>${n.sublabel ? ` <span class="muted">${esc(n.sublabel)}</span>` : ''}</li>` : ''; };
  function select(id) {
    state.sel = id; state.query = ''; $('#search').value = '';
    const n = NODES.get(id); if (!n) return;
    const m = n.module ? MODS.get(n.module) : null;
    const ins = G.edges.filter(e => e.to === id && whenOk(e.when)), outs = G.edges.filter(e => e.from === id && whenOk(e.when));
    const tag = n.kind === 'data' ? `${n.role || 'data'}${n.format ? ' · ' + n.format : ''}` : n.kind === 'decision' ? 'decision' : (n.helper ? 'plumbing' : 'step');
    let h = `<h2>${esc(n.label)}</h2><span class="tag">${esc(tag)}</span>`;
    h += `<p>${n.description ? esc(n.description) : '<span class="empty">No description yet.</span>'}</p><dl>`;
    if (m) h += `<dt>Stage</dt><dd>${esc(m.label)}</dd>`;
    if (n.sublabel) h += `<dt>Symbol</dt><dd><code>${esc(n.sublabel)}</code></dd>`;
    if (n.signature) h += `<dt>Signature</dt><dd><code>${esc(n.signature)}</code></dd>`;
    if (n.file) h += `<dt>${n.kind === 'data' ? 'File' : 'Source'}</dt><dd><code>${esc(n.file)}${n.lines ? ':' + n.lines[0] + '–' + n.lines[1] : ''}</code></dd>`;
    if (n.tools && n.tools.length) h += `<dt>Tools</dt><dd>${n.tools.map(t => `<code>${esc(t)}</code>`).join(' ')}</dd>`;
    if (n.param) h += `<dt>Flag</dt><dd><code>${esc(n.param)}</code></dd>`;
    if (n.fanout) { const v = VARS.find(x => x.id === n.fanout.variant); h += `<dt>Repeats</dt><dd>once per ${esc(n.fanout.item)}${v ? ` (<code>${esc(v.flag || v.label)}</code>)` : ''}</dd>`; }
    if (n.when) h += `<dt>Only on</dt><dd>${Object.entries(n.when).map(([k, v]) => { const va = VARS.find(x => x.id === k); const vals = (Array.isArray(v) ? v : [v]).map(o => (va && (va.options.find(z => z.id === o) || {}).label) || o); return `${esc((va || {}).label || k)}: ${esc(vals.join(', '))}`; }).join('<br>')}</dd>`;
    h += `</dl>`;
    h += `<h3>${n.kind === 'data' ? 'Produced by' : 'Takes'}</h3><ul>${ins.filter(e => e.kind !== 'call').map(e => linkTo(e.from)).join('') || '<li class="empty">nothing</li>'}</ul>`;
    h += `<h3>${n.kind === 'data' ? 'Used by' : 'Gives'}</h3><ul>${outs.filter(e => e.kind !== 'call').map(e => linkTo(e.to)).join('') || '<li class="empty">nothing</li>'}</ul>`;
    const calls = outs.filter(e => e.kind === 'call');
    if (calls.length) h += `<h3>Calls</h3><ul>${calls.map(e => linkTo(e.to)).join('')}</ul>`;
    if (n.code) h += `<h3>Code</h3><pre>${esc(n.code)}</pre>`;
    body.innerHTML = h;
    body.querySelectorAll('[data-go]').forEach(a => a.addEventListener('click', () => select(a.dataset.go)));
    drawer.classList.add('open');
    applyMarks();
  }
  function closeDrawer() { drawer.classList.remove('open'); state.sel = null; applyMarks(); }
  $('#drawer-close').addEventListener('click', closeDrawer);
  document.addEventListener('keydown', ev => {
    if (ev.key === 'Escape') { closeDrawer(); $('#search').value = ''; state.query = ''; applyMarks(); }
    if (ev.key === '/' && document.activeElement !== $('#search')) { ev.preventDefault(); $('#search').focus(); }
  });
  $('#svg').addEventListener('click', closeDrawer);

  /* ── chrome ─────────────────────────────────────────────────────────── */
  const p = G.pipeline;
  document.title = `${p.name} — flow`;
  $('#eyebrow').textContent = [p.name, p.version, p.source].filter(Boolean).join(' · ');
  $('#h1').textContent = p.title || `How ${p.name} works`;
  $('#lede').textContent = p.description || '';

  if (VARS.length) {
    $('#modes-section').hidden = false;
    $('#modes-sub').textContent = 'Pick the options you would pass on the command line; the diagram follows that route.';
    const box = $('#variants');
    for (const v of VARS) {
      const row = document.createElement('div'); row.className = 'variant';
      row.innerHTML = `<div class="vlabel">${esc(v.label)}${v.flag ? `<span>${esc(v.flag)}</span>` : ''}</div>`;
      const seg = document.createElement('div'); seg.className = 'seg';
      for (const o of v.options) {
        const b = document.createElement('button');
        b.type = 'button'; b.textContent = o.label; b.dataset.v = v.id; b.dataset.o = o.id;
        b.setAttribute('aria-pressed', String(state.mode[v.id] === o.id));
        b.addEventListener('click', () => {
          setMode(v.id, o.id);
          state.sel = null; closeDrawer(); render(); note(); caption();
        });
        seg.appendChild(b);
      }
      row.appendChild(seg);
      const nd = document.createElement('div'); nd.className = 'vnote'; nd.dataset.note = v.id;
      row.appendChild(nd);
      box.appendChild(row);
    }
  }
  function note() {
    for (const v of VARS) {
      const o = v.options.find(x => x.id === state.mode[v.id]);
      const d = document.querySelector(`[data-note="${v.id}"]`);
      if (d) d.textContent = (o && o.description) || v.description || '';
    }
  }
  function caption() {
    const parts = VARS.map(v => { const o = v.options.find(x => x.id === state.mode[v.id]); return `${v.label}: ${o ? o.label : '—'}`; });
    $('#cap').textContent = (p.caption ? p.caption + ' ' : '') + (parts.length ? 'Showing — ' + parts.join(' · ') + '.' : '');
  }
  $('#legend').innerHTML = [
    ['var(--surface)', 'var(--fg)', 'step'],
    ['var(--mark-soft)', 'var(--mark)', 'input / runs over every item'],
    ['var(--data-soft)', 'var(--data)', 'intermediate data'],
    ['var(--result-soft)', 'var(--pass)', 'result'],
  ].map(([bg, bd, t]) => `<span class="key"><span class="chip" style="background:${bg};border-color:${bd}"></span> ${t}</span>`).join('');

  $('#search').addEventListener('input', ev => {
    state.query = ev.target.value.trim().toLowerCase();
    if (state.query) { state.sel = null; drawer.classList.remove('open'); }
    applyMarks();
    if (state.query) { const first = document.querySelector('.node.hit'); if (first && first.scrollIntoView) first.scrollIntoView({ block: 'center', behavior: 'smooth' }); }
  });
  $('#f-helpers').addEventListener('change', e => { state.helpers = e.target.checked; render(); });
  $('#f-inter').addEventListener('change', e => { state.inter = e.target.checked; render(); });
  $('#b-theme').addEventListener('click', () => {
    const r = document.documentElement;
    const dark = r.dataset.theme === 'dark' || (!r.dataset.theme && matchMedia('(prefers-color-scheme: dark)').matches);
    r.dataset.theme = dark ? 'light' : 'dark';
    try { localStorage.setItem('fluxuviz-theme', r.dataset.theme); } catch (e) {}
  });
  try { const t = localStorage.getItem('fluxuviz-theme'); if (t) document.documentElement.dataset.theme = t; } catch (e) {}

  if (VARS.length) syncButtons();
  note(); caption(); render();
  if (document.fonts) {
    document.fonts.addEventListener('loadingdone', () => render());
    Promise.all(['600 13px "IBM Plex Sans"', '400 11px "IBM Plex Mono"'].map(f => document.fonts.load(f))).then(() => render()).catch(() => {});
  }
})();
</script>
</body>
</html>
