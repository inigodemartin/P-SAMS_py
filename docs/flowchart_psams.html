gument(\"-p\", \"--phytozome_fasta\", help=\"Genome assembly fasta\")\n    parser.add_argument(\"-d\", \"--descriptions\", help=\"Annotation description file\")\n    parser.add_argument(\"-v\", \"--version\", help=\"Genome version\")\n\n    args = parser.parse_args()\n\n    if not args.accessions and not args.fasta:\n        parser.error(\"An input sequence or a gene accession ID were not provided!\")\n\n    if args.accessions and not args.species:\n        parser.error(\"A species name was not provided!\")\n\n    # Screening against several transcriptomes is meant for a target gene\n    # that belongs to none of them (a pathogen infecting several hosts), so\n    # the target sequence comes in as FASTA. With -a the target is itself a\n    # transcript of one registered species, and which species owns the\n    # accession would be ambiguous.\n    species_count = len([n for n in (args.species or \"\").split(\",\") if n.strip()])\n\n    if species_count > 1 and args.accessions:\n        parser.error(\"-a/--accessions takes a single species. Several species are only \"\n                     \"supported with -f/--fasta input.\")\n\n    if species_count > 1 and args.noofftarget:\n        parser.error(\"-n/--noofftarget disables off-target prediction, so screening against \"\n                     \"several species has no effect. Pass a single species, or drop -n.\")\n\n    if args.fasta and not args.species and not args.noofftarget:\n        parser.error(\"Off-target prediction with -f requires -s/--species (or use -n/--noofftarget to disable it).\")\n\n    if args.jobs < 1:\n        parser.error(\"-j/--jobs must be at least 1.\")\n\n    if args.limit < 1:\n        parser.error(\"-l/--limit must be at least 1.\")\n\n    return args"}, {"id": "d_config", "kind": "data", "label": "Species registry", "module": null, "role": "input", "file": "psams.conf", "format": "ini", "param": "psams.conf", "description": "One section per registered species, giving the path of its k-mer SQLite database ('sql') and of its transcript FASTA ('mRNA'). A species named with -s but absent from the file stops the run."}, {"id": "d_background", "kind": "data", "label": "Background transcriptome", "module": null, "role": "input", "file": "{species}.db + mRNA.fa", "format": "sqlite + fasta", "param": "-s/--species", "description": "Per species: the SQLite database built by create_db.py (tables 'kmers' and 'annotation') used for the seed lookup, and the transcript FASTA that TargetFinder scans and that -a accessions are looked up in. With -f and -n no species is needed and none is opened.", "fanout": {"variant": "species", "item": "species", "detail": "kmers + annotation, mRNA FASTA", "note": "one comma-separated name per transcriptome to screen against", "note_kind": "muted"}}, {"id": "connect_backgrounds", "kind": "function", "label": "Open each species", "module": "m1", "description": "Reads psams.conf and opens, for every requested species, its k-mer SQLite database and its transcript FASTA. SQLite would happily create an empty file for a missing path, so each database is checked for the tables it must have.", "helper": false, "sublabel": "connect_backgrounds()", "signature": "connect_backgrounds(config, species)", "file": "src/utils.py", "lines": [48, 96], "code": "def connect_backgrounds(config, species):\n    \"\"\"\n    Connect to every background transcriptome this run screens against.\n\n    `species` is a comma-separated list of species names, each a section of\n    psams.conf. Returns one Background (name, open connection, mRNA FASTA\n    path) per species, in the order given; an empty list when no species\n    was provided (-f together with -n/--noofftarget).\n\n    Several backgrounds are what makes a guide designed against a pathogen\n    gene checkable against every host it can infect at once: a candidate is\n    only optimal when it has no off-target in ANY of them.\n    \"\"\"\n    backgrounds = []\n\n    for name in parse_species(species):\n        if name not in config:\n            sys.exit(f\"Error: species '{name}' is not registered in psams.conf.\")\n\n        db_path = Path(config[name]['sql'])\n        mRNA_fa = config[name]['mRNA']\n\n        # sqlite3.connect() happily creates an empty file for a path that\n        # does not exist, which used to surface much later as a bare\n        # \"no such table: kmers\" traceback in the middle of the run. Check\n        # here instead, where the message can say what to do about it.\n        if not db_path.exists():\n            sys.exit(f\"Error: k-mer database for '{name}' not found: {db_path}\\n\"\n                     f\"       Build it with create_db.py, then check the 'sql' path \"\n                     f\"in psams.conf.\")\n\n        if not Path(mRNA_fa).exists():\n            sys.exit(f\"Error: transcript FASTA for '{name}' not found: {mRNA_fa}\\n\"\n                     f\"       Check the 'mRNA' path in psams.conf.\")\n\n        connection = sqlite3.connect(db_path)\n        connection.row_factory = sqlite3.Row\n\n        tables = {row[0] for row in\n                  connection.execute(\"SELECT name FROM sqlite_master WHERE type='table'\")}\n        missing = {'kmers', 'annotation'} - tables\n        if missing:\n            sys.exit(f\"Error: database for '{name}' is missing the \"\n                     f\"{', '.join(sorted(missing))} table(s): {db_path}\\n\"\n                     f\"       Rebuild it with create_db.py.\")\n\n        backgrounds.append(Background(name, connection, mRNA_fa))\n\n    return backgrounds", "fanout": {"variant": "species", "item": "species", "detail": ".db + FASTA", "note": "a missing database or FASTA stops the run here, naming the species", "note_kind": "fail"}}, {"id": "d_run_folder", "kind": "data", "label": "Run folder", "module": null, "role": "intermediate", "description": "Results screened against two hosts are not the results screened against one, so several species get their own folder instead of being mistaken for a finished run.", "file": "{run}_psams_output[_vs_sp1+sp2]"}, {"id": "check_output", "kind": "function", "label": "Already computed?", "module": "m1", "description": "If this exact run already produced results, they are reused and the expensive part is skipped; only a change of cloning vector is re-done from the cached JSON.", "helper": false, "sublabel": "check_output()", "signature": "check_output(results_file, accession_list, output_folder, base_output = None, vector = None, construct = None, limit = 3, unlimit = False, want_vector_info = False, run_key = None)", "file": "src/utils.py", "lines": [578, 653], "code": "def check_output(results_file, accession_list, output_folder, base_output=None, vector=None, construct=None, limit=3, unlimit=False, want_vector_info=False, run_key=None):\n    \"\"\"\n    If a previous full run's results already exist for this input, avoid\n    re-running the (slow) TargetFinder pipeline.\n\n    limit/unlimit describe the CURRENT invocation's request, not the\n    previous run's: a cached run is only considered \"already satisfies\n    this request\" if it already found at least `limit` optimal results.\n    If `unlimit` is requested now, a capped previous run can never be\n    trusted to be exhaustive, so the shortcut is skipped and the pipeline\n    re-runs (e.g. a prior `-l 3` run must not short-circuit a `-l 10`\n    request just because it also happened to produce a 4-line TSV).\n\n    Without --vector, this keeps the original behaviour: report and exit,\n    since re-running would produce the exact same output.\n\n    With --vector: for amiRNA, `vector` is the chosen vector name and the\n    cached canonical output (base_output) is reused to (re)compute the\n    vector-specific cloning oligos directly. For syntasiRNA, no vector is\n    chosen here at all (want_vector_info is just True/False) — instead the\n    already-known optimal sites and the clone_vector.py command to run next\n    are printed, same as at the end of a fresh syntasiRNA run.\n\n    run_key namespaces every file this function reads/writes by construct\n    (see psams.py), so an amiRNA run and a syntasiRNA run for the same\n    accession(s) in the same output folder never read or overwrite each\n    other's cache/results. Falls back to the plain accession key when not\n    given (e.g. by older callers).\n    \"\"\"\n    if not results_file.exists():\n        return\n\n    with open(results_file, \"r\") as f:\n        line_count = sum(1 for _ in f)\n\n    optimal_count = line_count - 1\n    if unlimit or optimal_count < limit:\n        return\n\n    run_key = run_key or '_'.join(accession_list)\n\n    if not vector and not want_vector_info:\n        visible_output = output_folder / f\"{run_key}_psams.json\"\n        if base_output and base_output.exists() and not visible_output.exists():\n            shutil.copy2(base_output, visible_output)\n        print(f\"P-SAMS already executed for {'_'.join(accession_list)} ({construct}).\\nResults in {output_folder.resolve()}.\\nExiting script.\")\n        sys.exit(0)\n\n    if not base_output.exists():\n        print(f\"P-SAMS already executed for {'_'.join(accession_list)} ({construct}), but its cached results file ({base_output.name}) is missing. Re-running.\")\n        return\n\n    with open(base_output, \"r\") as f:\n        data = json.load(f)\n\n    if construct == \"amiRNA\":\n        apply_vector_to_amirna_output(data, vector)\n        vector_output = output_folder / f\"{run_key}_{vector_filename_suffix(vector)}_psams.json\"\n        with open(vector_output, \"w\") as out:\n            json.dump(data, out, indent=2)\n        write_amirna_tsv(data, vector_output.with_suffix(\".tsv\"))\n        print(\n            f\"P-SAMS already executed for {'_'.join(accession_list)}.\\n\"\n            f\"Reusing cached results and generating cloning oligos for vector '{vector}'.\\n\"\n            f\"Output: {vector_output.resolve()}\\nExiting script.\"\n        )\n        sys.exit(0)\n\n    site_index = syn_cached_site_index(data.get(\"blocks\", []))\n    if not site_index:\n        print(f\"P-SAMS already executed for {'_'.join(accession_list)}, but no optimal syn-tasiRNA sites were found; nothing to clone.\\nExiting script.\")\n        sys.exit(0)\n\n    print(f\"P-SAMS already executed for {'_'.join(accession_list)}.\")\n    print_syn_vector_instructions(site_index, output_folder, '_'.join(accession_list))\n    sys.exit(0)"}, {"id": "build_fg_index_fasta", "kind": "function", "label": "Read target sequences", "module": "m1", "description": "Parses the FASTA into one entry per sequence ID, which also supplies the names used for the run.", "helper": false, "sublabel": "build_fg_index_fasta()", "signature": "build_fg_index_fasta(fasta: str, debug: bool = False) -> dict", "file": "src/input_parser.py", "lines": [13, 58], "code": "def build_fg_index_fasta(fasta: str, debug: bool = False) -> dict:\n    \"\"\"\n    Parse FASTA-formatted string and build a dictionary:\n    {sequence_id: sequence}\n\n    Parameters\n    ----------\n    fasta : str\n        FASTA formatted text\n    debug : bool\n        Print debug information\n\n    Returns\n    -------\n    dict\n        Dictionary mapping IDs to sequences\n    \"\"\"\n\n    ids = {}\n    current_id = None\n\n    if debug:\n        print(\"Building foreground index...\", end=\"\", file=sys.stderr)\n\n    for line in fasta.splitlines():\n        line = line.strip()\n\n        # Skip empty lines\n        if not line:\n            continue\n\n        # Header line\n        if line.startswith(\">\"):\n            current_id = line[1:]\n            ids[current_id] = \"\"\n\n        # Sequence line\n        else:\n            if current_id is None:\n                raise ValueError(\"FASTA format error: sequence without header\")\n            ids[current_id] += line\n\n    if debug:\n        print(f\"{len(ids)} sequences loaded...done\", file=sys.stderr)\n\n    return ids", "when": {"input": "fasta"}}, {"id": "build_fg_index", "kind": "function", "label": "Look up target transcripts", "module": "m1", "description": "Resolves each accession against the species transcript FASTA, failing early on an ID that is not there.", "helper": false, "sublabel": "build_fg_index()", "signature": "build_fg_index(accessions, conn, species, mRNA_fa, min_length = 9, debug = False)", "file": "src/input_parser.py", "lines": [61, 159], "code": "def build_fg_index(accessions, conn, species, mRNA_fa, min_length=9, debug=False):\n    \"\"\"\n    Build foreground index from gene accessions using SQLite + samtools.\n\n    Parameters\n    ----------\n    accessions : list[str]\n        List of gene/transcript IDs\n    conn : sqlite3.Connection\n        Active database connection\n    species : str\n        Species name (used for ID normalization)\n    mRNA_fa : str\n        Path to mRNA FASTA\n    min_length : int\n        Minimum length of accession\n    debug : bool\n        Debug flag\n\n    Returns\n    -------\n    dict\n        {transcript_id: sequence}\n    \"\"\"\n\n    import re\n    import subprocess\n    import sys\n    import sqlite3\n    ids = {}\n    cursor = conn.cursor()\n\n    if debug:\n        print(\"Building foreground index...\", end=\"\", file=sys.stderr)\n\n    # SQLite uses ? instead of %s\n    query = \"SELECT * FROM annotation WHERE transcript LIKE ?\"\n\n    for accession in accessions:\n\n        # --------------------------------------------------\n        # Normalize accession (UNCHANGED LOGIC)\n        # --------------------------------------------------\n        accession = re.sub(r\"\\.\\d{1,2}$\", \"\", accession)\n\n        if species == \"Z_MAYS\":\n            if accession.startswith(\"AC\"):\n                accession = accession.replace(\"FGT\", \"FG\")\n            else:\n                accession = re.sub(r\"_T\\d{2}$\", \"\", accession)\n\n        elif species == \"C_REINHARDTII\":\n            accession = re.sub(r\"\\.t\\d$\", \"\", accession)\n\n        # Length check\n        if len(accession) < min_length:\n            print(f\"Gene {accession} not found in database!\", file=sys.stderr)\n            sys.exit(1)\n\n        # --------------------------------------------------\n        # Query SQLite database\n        # --------------------------------------------------\n        exists = False\n        cursor.execute(\"SELECT name FROM sqlite_master WHERE type='table'\")\n\n        cursor.execute(query, (f\"{accession}%\",))\n        results = cursor.fetchall()\n\n        for result in results:\n            exists = True\n            transcript = result[0] if isinstance(result, tuple) else result[\"transcript\"]\n            ids[transcript] = \"\"\n\n            # --------------------------------------------------\n            # Run samtools faidx (UNCHANGED)\n            # --------------------------------------------------\n            cmd = [\"samtools\", \"faidx\", mRNA_fa, transcript]\n            process = subprocess.Popen(\n                cmd,\n                stdout=subprocess.PIPE,\n                text=True\n            )\n\n            for line in process.stdout:\n                if line.startswith(\">\"):\n                    continue\n                ids[transcript] += line.strip()\n\n            process.stdout.close()\n            process.wait()\n\n        if not exists:\n            print(f\"Gene {accession} not found in database!\", file=sys.stderr)\n            sys.exit(1)\n\n    if debug:\n        print(\"done\", file=sys.stderr)\n\n    return ids", "when": {"input": "accessions"}}, {"id": "d_transcripts", "kind": "data", "label": "Target transcripts", "module": null, "role": "intermediate", "description": "The sequences the guide must hit, keyed by name.", "format": "dict", "fanout": {"variant": "construct", "item": "gene set", "detail": "its own guide", "note": "every step below runs once per ':'-separated gene set", "note_kind": "muted"}}, {"id": "get_tsites_bg", "kind": "function", "label": "21-nt windows, seed filtered", "module": "m2", "description": "Slides a 21-nt window along each target transcript and takes its 15-nt seed. The seed is looked up in every species k-mer database, and the window is dropped as soon as the seed appears in a transcript that is not one of the targets.", "helper": false, "sublabel": "get_tsites()", "signature": "get_tsites(ids: dict, seed: int, bg = False, backgrounds = None, debug = False) -> list", "file": "src/pipeline.py", "lines": [12, 97], "code": "def get_tsites(ids: dict, seed: int, bg=False, backgrounds=None, debug=False) -> list:\n    \"\"\"\n    Identify all putative target sites in transcripts.\n\n    Parameters\n    ----------\n    ids : dict\n        {transcript_id: sequence}\n    seed : int\n        Length of the seed region\n    bg : bool\n        If True, filter k-mers present in background database\n    backgrounds : list of utils.Background, optional\n        Every background transcriptome to screen against. Required if\n        bg=True. A seed found in a non-target transcript of ANY of them is\n        discarded, so this first filter is already the intersection of all\n        the hosts a guide must be clean in.\n    debug : bool\n        Print debug info\n\n    Returns\n    -------\n    list of dict\n        Each dict contains {'name': transcript_id, 'seq': 21-nt site}\n    \"\"\"\n    not_t_sites = []\n    t_sites = []\n    site_length = 21\n    offset = site_length - seed - 1\n    if debug:\n        print(\"Finding sites in foreground transcripts...\")\n\n    discard = set()  # kmers to discard\n    found = set()    # kmers already checked\n\n    cursors = []\n    if bg and backgrounds:\n        for background in backgrounds:\n            background.conn.row_factory = sqlite3.Row\n            cursors.append(background.conn.cursor())\n\n    for transcript, seq in ids.items():\n        length = len(seq)\n        if debug:\n            print(f\"Transcript {transcript} is {length} nt long\")\n\n        for i in range(length - site_length + 1):\n            site = seq[i:i + site_length]\n            if len(site) < site_length:\n                continue\n            kmer = site[offset:offset + seed]\n            # Background filtering\n            ## En la base de datos tenemos todos los posibles kmers (de 15 nt) del genoma a analizar y los transcritos donde aparecen\n            ## En esta parte del codigo se chequea que los kmers de nuestras secuencias únicamente estén en nuestro input\n            if bg and cursors:\n                is_bg = False\n\n                if kmer in discard:\n                    is_bg = True\n                    continue\n\n                elif kmer not in found:\n                    # Every background is queried, not just the first: the\n                    # seed has to be absent from all of them to survive.\n                    for cursor in cursors:\n                        cursor.execute(\"SELECT * FROM kmers WHERE kmer = ?\", (kmer,))\n                        results = cursor.fetchall()\n\n                        for result in results:\n                            accessions = result[\"transcripts\"].split(',')# aqui sacamos los transcritos que contienen ese k-mer\n\n                            for accession in accessions:\n                                if accession not in ids: # Si ese id no se encuentra en nuestros ids de input se descarta (osea, sería un offtarget)\n                                    is_bg = True\n                                    discard.add(kmer) # Aqui se almacenan los kmers que tienen off-targets\n                                    break\n                            if is_bg:\n                                break\n                        if is_bg:\n                            break\n                    found.add(kmer) #Aqui se almacenan los kmers que ya se han chequeado\n                    if is_bg:\n                        continue         \n            # Store site\n            t_sites.append({'name': transcript, 'seq': site})\n    return t_sites", "when": {"offtarget": "on"}, "fanout": {"variant": "species", "item": "species", "detail": "kmers table", "note": "a seed found in a foreign transcript of any species drops the window", "note_kind": "fail"}}, {"id": "get_tsites_plain", "kind": "function", "label": "21-nt windows", "module": "m2", "description": "Every 21-nt window of the target becomes a candidate site; with screening off no database is consulted.", "helper": false, "sublabel": "get_tsites()", "signature": "get_tsites(ids: dict, seed: int, bg = False, backgrounds = None, debug = False) -> list", "file": "src/pipeline.py", "lines": [12, 97], "code": "def get_tsites(ids: dict, seed: int, bg=False, backgrounds=None, debug=False) -> list:\n    \"\"\"\n    Identify all putative target sites in transcripts.\n\n    Parameters\n    ----------\n    ids : dict\n        {transcript_id: sequence}\n    seed : int\n        Length of the seed region\n    bg : bool\n        If True, filter k-mers present in background database\n    backgrounds : list of utils.Background, optional\n        Every background transcriptome to screen against. Required if\n        bg=True. A seed found in a non-target transcript of ANY of them is\n        discarded, so this first filter is already the intersection of all\n        the hosts a guide must be clean in.\n    debug : bool\n        Print debug info\n\n    Returns\n    -------\n    list of dict\n        Each dict contains {'name': transcript_id, 'seq': 21-nt site}\n    \"\"\"\n    not_t_sites = []\n    t_sites = []\n    site_length = 21\n    offset = site_length - seed - 1\n    if debug:\n        print(\"Finding sites in foreground transcripts...\")\n\n    discard = set()  # kmers to discard\n    found = set()    # kmers already checked\n\n    cursors = []\n    if bg and backgrounds:\n        for background in backgrounds:\n            background.conn.row_factory = sqlite3.Row\n            cursors.append(background.conn.cursor())\n\n    for transcript, seq in ids.items():\n        length = len(seq)\n        if debug:\n            print(f\"Transcript {transcript} is {length} nt long\")\n\n        for i in range(length - site_length + 1):\n            site = seq[i:i + site_length]\n            if len(site) < site_length:\n                continue\n            kmer = site[offset:offset + seed]\n            # Background filtering\n            ## En la base de datos tenemos todos los posibles kmers (de 15 nt) del genoma a analizar y los transcritos donde aparecen\n            ## En esta parte del codigo se chequea que los kmers de nuestras secuencias únicamente estén en nuestro input\n            if bg and cursors:\n                is_bg = False\n\n                if kmer in discard:\n                    is_bg = True\n                    continue\n\n                elif kmer not in found:\n                    # Every background is queried, not just the first: the\n                    # seed has to be absent from all of them to survive.\n                    for cursor in cursors:\n                        cursor.execute(\"SELECT * FROM kmers WHERE kmer = ?\", (kmer,))\n                        results = cursor.fetchall()\n\n                        for result in results:\n                            accessions = result[\"transcripts\"].split(',')# aqui sacamos los transcritos que contienen ese k-mer\n\n                            for accession in accessions:\n                                if accession not in ids: # Si ese id no se encuentra en nuestros ids de input se descarta (osea, sería un offtarget)\n                                    is_bg = True\n                                    discard.add(kmer) # Aqui se almacenan los kmers que tienen off-targets\n                                    break\n                            if is_bg:\n                                break\n                        if is_bg:\n                            break\n                    found.add(kmer) #Aqui se almacenan los kmers que ya se han chequeado\n                    if is_bg:\n                        continue         \n            # Store site\n            t_sites.append({'name': transcript, 'seq': site})\n    return t_sites", "when": {"offtarget": "off"}}, {"id": "group_tsites", "kind": "function", "label": "Group sites by seed", "module": "m2", "description": "Sites sharing a seed are merged, so one candidate guide is considered once no matter how many targets it covers.", "helper": false, "sublabel": "group_tsites()", "signature": "group_tsites(t_sites: list, seed: int, debug: bool = False) -> list", "file": "src/pipeline.py", "lines": [100, 178], "code": "def group_tsites(t_sites: list, seed: int, debug: bool = False) -> list:\n    \"\"\"\n    Group target sites based on seed sequence.\n\n    Parameters\n    ----------\n    t_sites : list of dict\n        [{'name': transcript_id, 'seq': sequence}, ...]\n    seed : int\n        Length of the seed region\n    debug : bool\n        Print debug information\n\n    Returns\n    -------\n    list of dict\n        [{'names': 'id1;id2', 'seqs': 'seq1;seq2'}, ...]\n    \"\"\"\n\n    site_length = 21\n    offset = site_length - seed - 1\n\n    if debug:\n        print(\"Grouping sites...\")\n\n    # --------------------------------------------------\n    # Sort by seed sequence, then by transcript name\n    # --------------------------------------------------\n    t_sites = sorted(\n        t_sites,\n        key=lambda x: (x['seq'][offset:offset + seed], x['name'])\n    )\n\n    gsites = []\n    names = []\n    seqs = []\n    last_seq = None\n    \n    for i, row in enumerate(t_sites):\n        current_seq = row['seq']\n        current_seed = current_seq[offset:offset + seed]\n\n        # Initialize first group\n        if not names:\n            last_seq = current_seq\n\n        last_seed = last_seq[offset:offset + seed]\n\n        if current_seed == last_seed:\n            names.append(row['name'])\n            seqs.append(current_seq)\n\n        else:\n            # Save previous group\n            gsites.append({\n                'names': \";\".join(names),\n                'seqs': \";\".join(seqs)\n            })\n\n            # Start new group\n            names = [row['name']]\n            seqs = [current_seq]\n            last_seq = current_seq\n\n    # --------------------------------------------------\n    # Add last group \n    # --------------------------------------------------\n    if names:\n        gsites.append({\n            'names': \";\".join(names),\n            'seqs': \";\".join(seqs)\n        })\n\n    if debug:\n        print(\"done\")\n    \n\n    # LO QUE HACE ESTA FUNCION ES AGRUPAR TODAS LAS TARGETSITES QUE TIENEN LA MISMA SEED\n    return gsites"}, {"id": "score_sites", "kind": "function", "label": "Score sites and design the guide", "module": "m3", "description": "Ranks the grouped sites by how well a guide would pair with them and builds the guide and star strand for the foldback type requested.", "helper": false, "sublabel": "score_sites()", "signature": "score_sites(gsites: list, min_site_count: int, seed: int, fb: str, debug: bool = False) -> list", "file": "src/pipeline.py", "lines": [182, 322], "code": "def score_sites(gsites: list, min_site_count: int, seed: int, fb: str, debug: bool = False) -> list:\n    \"\"\"\n    Score grouped target sites based on sequence similarity and positional rules.\n\n    Parameters\n    ----------\n    gsites : list of dict\n        [{'names': ..., 'seqs': ...}, ...]\n    min_site_count : int\n        Minimum number of sequences per group\n    seed : int\n        Seed length\n    fb : str\n        Foldback type\n    debug : bool\n        Debug flag\n\n    Returns\n    -------\n    list of dict\n        Scored sites\n    \"\"\"\n\n    site_length = 21\n    offset = site_length - seed - 1\n    scored = []\n\n    for site in gsites:\n\n        sites = site['seqs'].split(';')\n\n        if len(sites) < min_site_count:\n\n            continue\n        # -----------------------------\n        # Position 21 (index 20)\n        # -----------------------------\n        nts = {'A': 0, 'G': 0, 'C': 0, 'T': 0}\n        \n        for seq in sites:\n            nts[seq[20]] += 1\n        if nts['A'] == len(sites):\n            site['p21'] = 1\n        elif nts['G'] == len(sites):\n            site['p21'] = 2\n        elif nts['A'] + nts['G'] == len(sites):\n            site['p21'] = 3\n        else:\n            site['p21'] = 4\n\n        # -----------------------------\n        # Position 1 (index 0)\n        # -----------------------------\n        nts = {'A': 0, 'G': 0, 'C': 0, 'T': 0}\n        for seq in sites:\n            nts[seq[0]] += 1\n        if any(nts[n] == len(sites) for n in nts):\n            site['p1'] = 1\n        elif nts['G'] > 0 and nts['T'] > 0:\n            site['p1'] = 2\n        else:\n            site['p1'] = 1\n        # -----------------------------\n        # Position 2 (index 1)\n        # -----------------------------\n        nts = {'A': 0, 'G': 0, 'C': 0, 'T': 0}\n        for seq in sites:\n            nts[seq[1]] += 1\n\n        if any(nts[n] == len(sites) for n in nts):\n            site['p2'] = 1\n        elif nts['G'] > 0 and nts['A'] > 0 and nts['G'] + nts['A'] == len(sites):\n            site['p2'] = 2\n        else:\n            site['p2'] = 3\n        # -----------------------------\n        # Position 3 (index 2)\n        # -----------------------------\n        nts = {'A': 0, 'G': 0, 'C': 0, 'T': 0}\n        for seq in sites:\n            nts[seq[2]] += 1\n\n        if nts['G'] == len(sites):\n            site['p3'] = 1\n        elif any(nts[n] == len(sites) for n in ['A', 'C', 'T']):\n            site['p3'] = 2\n        else:\n            site['p3'] = 3\n\n        # -----------------------------\n        # Other mismatches\n        # -----------------------------\n        site['other_mm'] = 0\n\n        for i in range(3, offset):\n            nts = {'A': 0, 'G': 0, 'C': 0, 'T': 0}\n            for seq in sites:\n                nts[seq[i]] += 1\n\n            if not any(nts[n] == len(sites) for n in nts):\n                site['other_mm'] += 1\n\n        # -----------------------------\n        # Guide + oligos\n        # -----------------------------\n        guide = design_guide_RNA(site)\n       \n        if len(guide) < site_length:\n            continue\n\n        site['guide'] = guide\n        \n        star, oligo1, oligo2 = oligo_designer(guide, fb)\n\n        site['star'] = star\n        site['oligo1'] = oligo1\n        site['oligo2'] = oligo2\n\n        scored.append(site)\n\n    if debug:\n        print(\"Sorting and outputing results...\")\n\n    # -----------------------------\n    # Sorting\n    # -----------------------------\n    scored = sorted(\n        scored,\n        key=lambda x: (\n            x['other_mm'],\n            x['p21'],\n            x['p3'],\n            x['p2'],\n            x['p1']\n        )\n    )\n\n    if debug:\n        print(f\"Analyzing {len(scored)} total sites...\")\n\n    return scored"}, {"id": "d_candidates", "kind": "data", "label": "Scored candidates", "module": null, "role": "intermediate", "description": "Candidate guides in the order they will be tried; the number of species does not affect this ranking.", "format": "list"}, {"id": "load_resume_state", "kind": "function", "label": "Resume a previous run", "sublabel": "load_resume_state()", "module": "m4", "description": "When an earlier run of the same targets left an optimal_results.tsv behind (for instance capped by a lower -l/--limit), its rows and the cached tf_results/*.json are read back so TargetFinder is skipped for every guide already evaluated and new site numbering continues after the last one used.", "signature": "load_resume_state(tf_dir, opt_name, subopt_name, gene_set=None) -> (opt, subopt, seen_guides, start_count)", "file": "src/utils.py", "lines": [361, 475], "helper": true, "code": "def load_resume_state(tf_dir, opt_name, subopt_name, gene_set=None):\n    \"\"\"\n    Reconstruct already-evaluated candidates from a previous partial run's\n    TSV rows and its cached tf_results/*.json files, so a resumed run\n    (e.g. -l raised past what was already found, or -u/--unlimit requested\n    on a previously-capped run) can skip TargetFinder entirely for guides\n    already evaluated and only look for new ones.\n\n    Returns (opt, subopt, seen_guides, start_count):\n      opt, subopt : lists in the shape serial_jobs builds internally,\n                    ready to seed a resumed serial_jobs() call\n      seen_guides : set of guide sequences already evaluated (any verdict)\n      start_count : highest Site_index already used, so new TSV rows and\n                    tf_results files continue numbering instead of\n                    colliding with the existing ones\n    \"\"\"\n    gs_prefix = f\"gs{gene_set}_\" if gene_set is not None else \"\"\n    opt = []\n    subopt = []\n    seen_guides = set()\n    start_count = 0\n\n    def _rows(path):\n        path = Path(path)\n        if not path.exists():\n            return\n        with open(path) as fh:\n            header = fh.readline()\n            if not header:\n                return\n            cols = header.rstrip(\"\\n\").split(\"\\t\")\n            # lineno counts from 1 for the first row after the header, so a\n            # dropped row can be pruned from the file by position (see\n            # _prune_rows) without having to match its text.\n            for lineno, line in enumerate(fh, start=1):\n                if not line.strip():\n                    continue\n                values = line.rstrip(\"\\n\").split(\"\\t\")\n                row = dict(zip(cols, values))\n                if gene_set is not None and int(row.get(\"Gene_set\", gene_set)) != gene_set:\n                    continue\n                yield row, lineno\n\n    def _prune_rows(path, dropped):\n        \"\"\"\n        Delete the rows whose cached TargetFinder result was unusable.\n\n        Those candidates are re-evaluated below and appended again under a\n        new Site_index, and serial_jobs() opens these TSVs in append mode,\n        so leaving the old rows in place would list the same guide twice —\n        once pointing at a cache that cannot be read.\n        \"\"\"\n        if not dropped:\n            return\n        path = Path(path)\n        lines = path.read_text().splitlines(keepends=True)\n        header, body = lines[0], lines[1:]\n        kept = [line for n, line in enumerate(body, start=1) if n not in dropped]\n        path.write_text(header + \"\".join(kept))\n\n    def _load_tf(count):\n        path = Path(f\"{tf_dir}/site_{gs_prefix}{count:04d}_TargetFinder_result.json\")\n        if not path.exists():\n            return None\n        text = path.read_text()\n        try:\n            json.loads(text)\n        except ValueError:\n            # Empty or truncated cache (the previous run died right after\n            # the file was opened in \"w\" mode). Report it as missing so the\n            # candidate is sent to TargetFinder again instead of resuming\n            # with an unusable TargetFinder result.\n            return None\n        return text\n\n    dropped_opt = set()\n    dropped_subopt = set()\n\n    for row, lineno in _rows(opt_name):\n        count = int(row[\"Site_index\"])\n        start_count = max(start_count, count)\n        tf = _load_tf(count)\n        if tf is None:\n            dropped_opt.add(lineno)\n            continue\n        opt.append({\n            'guide': row['Guide'], 'star': row['Star'],\n            # syntasiRNA checkpoint rows have no Oligo1/Oligo2 (see\n            # create_outputs) — unused downstream for that construct anyway.\n            'oligo1': row.get('Oligo1', ''), 'oligo2': row.get('Oligo2', ''),\n            'tf': tf,\n        })\n        seen_guides.add(row['Guide'])\n\n    for row, lineno in _rows(subopt_name):\n        count = int(row[\"Site_index\"])\n        start_count = max(start_count, count)\n        tf = _load_tf(count)\n        if tf is None:\n            dropped_subopt.add(lineno)\n            continue\n        site = {\n            'guide': row['Guide'], 'star': row['Star'],\n            'oligo1': row.get('Oligo1', ''), 'oligo2': row.get('Oligo2', ''),\n            'tf': tf,\n        }\n        subopt.append({'off_targets': int(row['Offtarget_N']), 'site': site})\n        seen_guides.add(row['Guide'])\n\n    _prune_rows(opt_name, dropped_opt)\n    _prune_rows(subopt_name, dropped_subopt)\n\n    return opt, subopt, seen_guides, start_count\n\n", "when": {"offtarget": "on"}}, {"id": "serial_jobs", "kind": "function", "label": "TargetFinder per species", "module": "m4", "description": "For every candidate, runs TargetFinder once per transcriptome. There is no short-circuit: even when the first species already rejects a guide, the rest still run, so every off-target is reported with the host it was found in. Results are cached per guide and species.", "helper": false, "sublabel": "serial_jobs()", "signature": "serial_jobs(target_count, construct, ids, site_scores, targetfinder, backgrounds, bg, subopt_name, opt_name, output_folder, accession_list, tf_dir, potential_target_n, unlimit = False, fasta = False, jobs = 1, limit = 3, gene_set = None, existing_opt = None, existing_subopt = None, seen_guides = None, start_count = 0)", "file": "src/pipeline.py", "lines": [461, 834], "code": "def serial_jobs(target_count, construct, ids, site_scores,targetfinder, backgrounds, bg,subopt_name, opt_name, output_folder,accession_list, tf_dir, potential_target_n,unlimit=False, fasta=False, jobs=1, limit=3, gene_set=None, existing_opt=None, existing_subopt=None, seen_guides=None, start_count=0):\n    \"\"\"\n    Run serial jobs for amiRNA evaluation.\n\n    Parameters\n    ----------\n    target_count : int\n        Expected number of on-targets.\n\n    construct : str\n        Construct prefix name.\n\n    ids : dict\n        Dictionary containing transcript sequences:\n        {transcript_id: sequence}\n\n    bg : bool\n        Whether to check off-targets using TargetFinder.\n\n    site_scores : list\n        List of grouped and scored target sites.\n\n    targetfinder : str\n        Path to TargetFinder script.\n\n    backgrounds : list of utils.Background\n        Every background transcriptome to screen candidates against. A\n        candidate is only optimal when it has no off-target in any of them,\n        which is what lets one guide be designed against a pathogen gene\n        and checked against all of its hosts at once.\n\n    fasta : bool\n        Whether input comes from FASTA.\n\n    unlimit : bool\n        If True, do not limit the number of optimal results.\n\n    limit : int\n        Maximum number of optimal results to find before stopping.\n        Ignored when unlimit is True. Default = 3.\n\n    gene_set : int, optional\n        1-indexed gene set number for syntasiRNA multi-gene-set runs. When\n        set, every TSV row is prefixed with a Gene_set column so rows from\n        different gene sets (which share the same TSV file) can be told\n        apart. None (default) for amiRNA, which has no gene sets.\n\n    existing_opt, existing_subopt : list, optional\n        Already-evaluated optimal/suboptimal candidates from a previous\n        partial run (see utils.load_resume_state), to resume from instead\n        of starting over.\n\n    seen_guides : set, optional\n        Guide sequences already evaluated in a previous partial run;\n        candidates with these guides are skipped instead of being sent to\n        TargetFinder again.\n\n    start_count : int, optional\n        Highest Site_index/tf_results file number already used by a\n        previous partial run, so resumed rows/files continue numbering\n        instead of colliding with existing ones.\n\n    jobs : int\n        Number of TargetFinder calls to run in parallel. Default = 1 (serial).\n\n    Returns\n    -------\n    tuple\n        (opt, subopt)\n    \"\"\"\n    # In no-offtarget mode (bg=False), every candidate is treated as a plain\n    # \"result\" (see the bg-False branch below) — nothing is ever classified\n    # as optimal/suboptimal, so the TSV files are never written to. Skip\n    # creating them at all rather than leaving behind header-only files.\n    subopt_cm = open(subopt_name, 'a', buffering=1) if bg else contextlib.nullcontext(None)\n    opt_cm = open(opt_name, 'a', buffering=1) if bg else contextlib.nullcontext(None)\n    row_prefix = f\"{gene_set}\\t\" if gene_set is not None else \"\"\n    gs_prefix = f\"gs{gene_set}_\" if gene_set is not None else \"\"\n\n    def _opt_row(site, count):\n        # syntasiRNA (gene_set is not None) checkpoint rows never carry\n        # Oligo1/Oligo2 — see create_outputs.\n        cols = [f\"{row_prefix}{count}\", site['guide'], site['star']]\n        if gene_set is None:\n            cols += [site['oligo1'], site['oligo2']]\n        cols += [site['names'], site['seqs']]\n        return \"\\t\".join(cols) + \"\\n\"\n\n    def _subopt_row(site, count):\n        cols = [\n            f\"{row_prefix}{count}\", str(site['offtarget_number']), str(site['offtarget_list']),\n            site['guide'], site['star'],\n        ]\n        if gene_set is None:\n            cols += [site['oligo1'], site['oligo2']]\n        cols += [site['names'], site['seqs']]\n        return \"\\t\".join(cols) + \"\\n\"\n\n    # Resuming: candidates whose guide was already evaluated in a previous\n    # partial run are dropped from site_scores so TargetFinder never runs\n    # on them again; only genuinely new candidates go through the loop\n    # below, and their results are appended to the already-found ones.\n    if seen_guides:\n        site_scores = [s for s in site_scores if s['guide'] not in seen_guides]\n\n    with subopt_cm as subopt_out, opt_cm as opt_out:\n\n        start_time = time.time()\n\n        opt = list(existing_opt) if existing_opt else []\n        subopt = list(existing_subopt) if existing_subopt else []\n\n        # Already have enough optimal results from a previous run: nothing\n        # left to do for this gene set.\n        if not unlimit and len(opt) >= limit:\n            site_scores = []\n\n        optimal_ref = [len(opt)]\n        suboptimal_ref = [len(subopt)]\n\n        stop_event = threading.Event()\n\n        thread = threading.Thread(\n            target=_status_loop,\n            args=(start_time, accession_list, optimal_ref, suboptimal_ref, stop_event, potential_target_n, bg),\n            daemon=True\n        )\n        thread.start()\n\n        count = start_count\n\n        n_sites = len(site_scores)\n        jobs = max(1, jobs)\n\n        # Shared across constructs (see _load_tf_cache): a guide already\n        # TargetFinder-tested by e.g. an earlier amiRNA run for this same\n        # gene(s) doesn't need to be tested again for a later syntasiRNA\n        # run in the same output folder, and vice versa.\n        tf_cache = _load_tf_cache(Path(output_folder) / \".cache\" / \"tf_results_cache.json\") if bg else None\n\n        # ------------------------------------------------------------\n        # When jobs > 1, run TargetFinder for several candidates ahead\n        # of time in a thread pool (subprocess calls release the GIL),\n        # while still consuming results in order. Each prefetched call\n        # uses a placeholder query name (since the final \"{construct}N\"\n        # name depends on how many optimal sites have been found so\n        # far, which is only known once results are processed in\n        # order); the placeholder is swapped for the real name once\n        # the result is consumed.\n        # ------------------------------------------------------------\n        executor = None\n        pending = {}\n\n        backgrounds = backgrounds or []\n        # Screening against several transcriptomes is the only case that\n        # needs each hit labelled with the host it was found in; a\n        # single-background run keeps exactly the output it had before.\n        multi = len(backgrounds) > 1\n        offtarget_hosts = Counter()\n\n        lookahead = jobs\n\n        if bg and jobs > 1:\n            executor = ThreadPoolExecutor(max_workers=jobs)\n\n            def _submit(i):\n                placeholder = f\"{construct}_job{i}\"\n                pending[i] = (\n                    placeholder,\n                    [\n                        executor.submit(_run_targetfinder, targetfinder, site_scores[i]['guide'],\n                                        background, placeholder, tf_cache)\n                        for background in backgrounds\n                    ]\n                )\n\n            # Every candidate now costs one TargetFinder call per\n            # background, so fewer candidates are kept in flight to still\n            # run -j/--jobs external calls at a time.\n            lookahead = max(1, jobs // max(1, len(backgrounds)))\n            for i in range(min(lookahead, n_sites)):\n                _submit(i)\n\n        next_submit = lookahead\n\n        for idx, site in enumerate(site_scores):\n\n            count += 1\n            site['name'] = f\"{construct}{optimal_ref[0]}\"\n\n            if bg:\n\n                if executor:\n                    placeholder, futures = pending.pop(idx)\n                    per_background = [\n                        (background, [line.replace(placeholder, site['name']) for line in future.result()])\n                        for background, future in zip(backgrounds, futures)\n                    ]\n\n                    # Keep the pipeline full: queue the next candidate as\n                    # soon as a slot frees up.\n                    if next_submit < n_sites:\n                        _submit(next_submit)\n                        next_submit += 1\n\n                else:\n                    per_background = [\n                        (background, _run_targetfinder(targetfinder, site['guide'], background, site['name'], tf_cache))\n                        for background in backgrounds\n                    ]\n\n                searched = [(background, lines) for background, lines in per_background if not _no_results(lines)]\n\n                # A background returning nothing means different things in\n                # the two input modes. With -a the target is itself one of\n                # the searched transcripts, so a guide that aligns nowhere\n                # does not even hit its own target and is unusable. With -f\n                # the target may well be absent from every transcriptome\n                # searched (a pathogen gene screened against its hosts), so\n                # finding nothing there is the best possible outcome, and\n                # the on-target pairing is computed separately below.\n                if not searched and not fasta:\n                    continue\n\n                off_targets = 0\n                on_targets = 0\n                offtarget_list = []\n                tf_hits = []\n\n                for background, lines in searched:\n                    off, on, json_data, off_list = off_target_check(\n                        site, lines, background.conn, construct\n                    )\n                    hits = _hits_from_lines(json_data)\n\n                    if multi:\n                        off_list = [f\"{background.name}:{accession}\" for accession in off_list]\n                        hits = [_tag_species(hit, background.name) for hit in hits]\n\n                    off_targets += off\n                    on_targets += on\n                    offtarget_list.extend(off_list)\n                    tf_hits.extend(hits)\n\n                    if off:\n                        offtarget_hosts[background.name] += 1\n\n                site['offtarget_list'] = offtarget_list\n                site['offtarget_number'] = len(offtarget_list)\n\n                if fasta:\n\n                    on_hits = []\n                    seqs = site['seqs'].split(';')\n                    names = site['names'].split(';')\n\n                    for seq, name in zip(seqs, names):\n                        hit = base_pair(seq, name, ids[name], site['guide'], construct)\n                        # base_pair returns nothing when the site cannot be\n                        # located in its own transcript; such a hit has no\n                        # JSON to merge.\n                        if hit:\n                            on_hits.append(json.loads(\"\\n\".join(hit)))\n\n                    # Same as before: the searched transcriptomes' own hits\n                    # are only carried over when there is something\n                    # off-target to show, since the on-target pairing is\n                    # already described by on_hits.\n                    site['tf'] = _tf_document(site['name'], on_hits + (tf_hits if off_targets else []))\n\n                    if off_targets == 0:\n\n                        opt.append(site)\n\n                        opt_out.write(_opt_row(site, count))\n\n                        with open(f\"{tf_dir}/site_{gs_prefix}{count:04d}_TargetFinder_result.json\", \"w\") as siteout:\n                            json.dump(json.loads(site['tf']), siteout, indent=4)\n\n                        optimal_ref[0] += 1\n\n                    else:\n\n                        subopt.append({\n                            'off_targets': off_targets,\n                            'site': site\n                        })\n\n                        subopt_out.write(_subopt_row(site, count))\n\n                        with open(f\"{tf_dir}/site_{gs_prefix}{count:04d}_TargetFinder_result.json\", \"w\") as siteout:\n                            json.dump(json.loads(site['tf']), siteout, indent=4)\n\n                        suboptimal_ref[0] += 1\n\n                else:\n\n                    site['tf'] = _tf_document(site['name'], tf_hits)\n\n                    if off_targets == 0 and on_targets == target_count:\n\n                        opt.append(site)\n\n                        opt_out.write(_opt_row(site, count))\n\n                        with open(f\"{tf_dir}/site_{gs_prefix}{count:04d}_TargetFinder_result.json\", \"w\") as siteout:\n                            json.dump(json.loads(site['tf']), siteout, indent=4)\n\n                        optimal_ref[0] += 1\n\n                    else:\n\n                        subopt.append({\n                            'off_targets': off_targets,\n                            'site': site\n                        })\n\n                        subopt_out.write(_subopt_row(site, count))\n\n                        with open(f\"{tf_dir}/site_{gs_prefix}{count:04d}_TargetFinder_result.json\", \"w\") as siteout:\n                            json.dump(json.loads(site['tf']), siteout, indent=4)\n\n                        suboptimal_ref[0] += 1\n\n            else:\n\n                insert = []\n                seqs = site['seqs'].split(';')\n                names = site['names'].split(';')\n\n                for seq, name in zip(seqs, names):\n                    hit = base_pair(seq, name, ids[name], site['guide'], construct)\n                    if hit:\n                        insert.append(json.loads(\"\\n\".join(hit)))\n\n                site['tf'] = _tf_document(site['name'], insert)\n\n                opt.append(site)\n                optimal_ref[0] += 1\n\n            if optimal_ref[0] == limit and not unlimit:\n                break\n\n        if executor:\n            # wait=True: any candidates already prefetched and running when\n            # the limit was hit must finish before this function returns —\n            # with wait=False those TargetFinder subprocesses kept running\n            # as orphaned, non-daemon executor threads, which Python's\n            # interpreter shutdown then silently blocked on (the process\n            # looked hung, or dumped a KeyboardInterrupt traceback, well\n            # after \"Finished running P-SAMS successfully!\" had printed).\n            executor.shutdown(wait=True, cancel_futures=True)\n\n        stop_event.set()\n        thread.join()\n\n        # The for loop above can drain a whole burst of already-completed\n        # futures (jobs > 1) faster than the once-a-second status thread\n        # can observe, so the last line it printed may be stale (e.g. still\n        # showing 0 optimal sites right before this gene set's true count).\n        # Render one final, synchronous line with the actual end-of-loop\n        # counts before moving on.\n        _render_status_line(start_time, accession_list, optimal_ref, suboptimal_ref, potential_target_n, bg)\n\n    print()\n\n    # With several hosts, knowing WHICH one rejected a candidate is what\n    # tells the user whether dropping a host would recover usable guides.\n    if multi and offtarget_hosts:\n        print(\"  Candidates with off-targets per background:\")\n        for background in backgrounds:\n            print(f\"    {background.name}: {offtarget_hosts[background.name]}\")\n\n    return opt, subopt", "tools": ["targetfinder.pl"], "when": {"offtarget": "on"}, "fanout": {"variant": "species", "item": "species", "detail": "FASTA + annotation", "note": "one call per candidate and species; each hit is tagged with its host", "note_kind": "muted"}}, {"id": "dec_clean", "kind": "decision", "label": "Zero off-targets in every species?", "module": "m4", "description": "A guide is optimal only when no transcriptome returned an off-target. With FASTA input, finding nothing at all is the best outcome, since the target itself is usually absent from the transcriptomes being screened.", "helper": false, "signature": "off_target_check(site: dict, tf_results: list, conn, construct: str = 'amiRNA') -> tuple", "file": "src/utils.py", "lines": [658, 732], "code": "def off_target_check(site: dict, tf_results: list, conn, construct: str = \"amiRNA\") -> tuple:\n    \"\"\"\n    Use TargetFinder output to classify on-targets and off-targets.\n\n    Parameters\n    ----------\n    site : dict\n        Site information (must contain 'names', 'seqs', 'guide', etc.)\n    tf_results : list\n        Lines of output from TargetFinder\n    conn : sqlite3 connection\n        Database connection to annotation table\n    construct : str\n        \"amiRNA\" or \"syntasiRNA\". TargetFinder/targetfinder.pl always\n        labels the guide sequence line \"amiRNA sequence\" regardless of\n        construct (it predates syntasiRNA support and isn't construct-\n        aware); relabel it here to match the actual construct instead of\n        patching the vendored Perl script.\n\n    Returns\n    -------\n    tuple\n        (offCount, onCount, json_lines)\n    \"\"\"\n    from html import unescape\n    off_target_list = []\n    off_count = 0\n    on_count = 0\n    json_lines = []\n\n    cursor = conn.cursor()\n\n    for line in tf_results:\n\n        line = line.strip()\n        if '\"amiRNA sequence\"' in line and construct != \"amiRNA\":\n            line = line.replace('\"amiRNA sequence\"', f'\"{construct} sequence\"')\n        json_lines.append(line)\n\n        if \"Target accession\" in line:\n            tag, transcript = line.split(\": \", 1)\n            transcript = transcript.replace('\"', '').replace(',', '').split()[0]\n\n            # Query database (SQLite version)\n            cursor.execute(\n                \"SELECT * FROM annotation WHERE transcript = ?\",\n                (transcript,)\n            )\n            result = cursor.fetchone()\n\n            # SQLite returns tuple unless row_factory is set\n            if result:\n                # if using row_factory = sqlite3.Row\n                try:\n                    desc_value = result[\"description\"]\n                except TypeError:\n                    desc_value = result[1]  # fallback: column index\n\n                if desc_value:\n                    desc = unescape(desc_value)\n                    desc = desc.replace(\";\", \"\")\n                    json_lines.append(f'        \"Target description\": {json.dumps(desc)},')\n                else:\n                    json_lines.append('        \"Target description\": \"unknown\",')\n            else:\n                json_lines.append('        \"Target description\": \"unknown\",')\n\n            # Check if on-target or off-target\n            if transcript in site['names']:\n                on_count += 1\n            else:\n                off_count += 1\n                off_target_list.append(transcript)\n\n    return off_count, on_count, json_lines, off_target_list", "when": {"offtarget": "on"}}, {"id": "d_opt", "kind": "data", "label": "Optimal", "module": null, "role": "result", "description": "Guides clean in every host.", "when": {"offtarget": "on"}}, {"id": "d_subopt", "kind": "data", "label": "Suboptimal", "module": null, "role": "result", "description": "Guides with at least one off-target, listed as species:transcript.", "when": {"offtarget": "on"}}, {"id": "d_tf", "kind": "data", "label": "TargetFinder output", "module": null, "role": "result", "description": "Per-site TargetFinder results, one file per candidate.", "file": "tf_results/", "when": {"offtarget": "on"}}, {"id": "create_opt_subopt", "kind": "function", "label": "Collect the results", "module": "m5", "description": "Assembles the optimal and suboptimal sets into the structure the output files are written from. With screening off nothing is classified, so every candidate is plain.", "helper": false, "sublabel": "create_opt_subopt()", "signature": "create_opt_subopt(subopt, opt, construct, no_offtarget = False, debug = False)", "file": "src/utils.py", "lines": [849, 922], "code": "def create_opt_subopt(subopt, opt, construct, no_offtarget=False, debug=False):\n    \"\"\"\nFormat and organize optimal and suboptimal target sites into structured output dictionaries, updating their labels in the TargetFinder results.\n\nSuboptimal sites are sorted by off-target count and limited to the top three, while both groups include guide, star, oligos, and modified TF information.\nParameters\n----------\nsubopt : list of dict\n    Suboptimal sites, each containing a 'site' dictionary and an 'off_targets' count\nopt : list of dict\n    Optimal sites\nconstruct : str\n    Construct name used for labeling results\nno_offtarget : bool, optional\n    If True, off-target checking was disabled: nothing was actually\n    classified as optimal, so results are labeled generically instead\ndebug : bool, optional\n    If True, prints debugging information\n\nReturns\n-------\ntuple\n    opt_count : int\n        Number of optimal sites processed\n    subopt_count : int\n        Number of suboptimal sites processed (max 3)\n    opt_results : dict\n        Dictionary of formatted optimal results\n    subopt_results : dict\n        Dictionary of formatted suboptimal results\n\n\"\"\"\n    opt_results = {}\n    subopt_results = {}\n    # Sort suboptimal sites by off-targets\n    subopt.sort(key=lambda x: x['off_targets'])\n\n    if debug:\n        pprint(opt)\n\n    # Process optimal results\n    opt_label = \"Result\" if no_offtarget else \"Optimal Result\"\n    opt_count = 0\n    for i, site in enumerate(opt, start=1):\n        opt_count += 1\n        # Replace construct name in TF JSON\n        site['tf'] = site['tf'].replace(f\"{construct}{i}\", f\"{construct} {opt_label} {i}\")\n\n        opt_results[i] = {\n            'guide': site['guide'],\n            'star': site['star'],\n            'oligo1': site['oligo1'],\n            'oligo2': site['oligo2'],\n            'tf': site['tf']\n        }\n  \n\n    # Process suboptimal results\n    subopt_count = 0\n    for i, ssite in enumerate(subopt, start=1):\n        subopt_count += 1\n        site = ssite['site']\n        site['tf'] = site['tf'].replace(f\"{construct}{i}\", f\"{construct} Suboptimal Result {i}\")\n        subopt_results[i] = {\n            'guide': site['guide'],\n            'star': site['star'],\n            'oligo1': site['oligo1'],\n            'oligo2': site['oligo2'],\n            'tf': site['tf']\n        }\n        if subopt_count == 3:\n            break\n\n    return opt_count, subopt_count, opt_results, subopt_results"}, {"id": "amirna_json", "kind": "function", "label": "Build the amiRNA result", "module": "m5", "description": "Writes the canonical, vector-independent JSON that every other output is derived from.", "helper": false, "sublabel": "amirna_json()", "signature": "amirna_json(opt_count, sub_count, opt, sub, output_file, vector = None, no_offtarget = False, foldback = None)", "file": "src/utils.py", "lines": [1077, 1134], "code": "def amirna_json(opt_count, sub_count, opt, sub, output_file, vector=None, no_offtarget=False, foldback=None):\n    \"\"\"\n    Builds the JSON output for amiRNA results.\n\n    Args:\n        opt_count (int): number of optimal results\n        sub_count (int): number of suboptimal results\n        opt (dict): dictionary of optimal results\n        sub (dict): dictionary of suboptimal results\n        vector (str, optional): cloning vector name\n        no_offtarget (bool, optional): if True, off-target checking was\n            disabled, so results are labeled generically (not optimal/\n            suboptimal) and the suboptimal section is omitted\n        foldback (str, optional): 'eudicot' or 'monocot'. Recorded so a\n            later cloning step knows which foldback the cached amiRNA*\n            belongs to — the two use different basal stems, and only the\n            eudicot AtMIR390a one has a defined insert-vector design.\n    \"\"\"\n    section_key = \"results\" if no_offtarget else \"optimal\"\n    entry_label = \"amiRNA Result\" if no_offtarget else \"amiRNA Optimal Result\"\n\n    output = {section_key: {}}\n    if not no_offtarget:\n        output[\"suboptimal\"] = {}\n    if vector:\n        output[\"vector\"] = vector\n    if foldback:\n        output[\"foldback\"] = foldback\n    result_count = 0\n\n    # Optimal / generic results\n    for i in range(1, opt_count + 1):\n        result_count += 1\n        output[section_key][f\"{entry_label} {result_count}\"] = {\n            \"amiRNA\": opt[i][\"guide\"],\n            \"amiRNA*\": opt[i][\"star\"],\n            \"Forward Oligo\": opt[i][\"oligo1\"],\n            \"Reverse Oligo\": opt[i][\"oligo2\"],\n            \"TargetFinder\": _extract_tf_hits(opt[i][\"tf\"])\n        }\n\n    # Suboptimal results (only when off-target checking is enabled)\n    if not no_offtarget:\n        result_count = 0\n        for i in range(1, sub_count + 1):\n            result_count += 1\n            output[\"suboptimal\"][f\"amiRNA Suboptimal Result {result_count}\"] = {\n                \"amiRNA\": sub[i][\"guide\"],\n                \"amiRNA*\": sub[i][\"star\"],\n                \"Forward Oligo\": sub[i][\"oligo1\"],\n                \"Reverse Oligo\": sub[i][\"oligo2\"],\n                \"TargetFinder\": _extract_tf_hits(sub[i][\"tf\"])\n            }\n\n    with open(output_file, \"w\") as out:\n        json.dump(output, out, indent=2)\n\n    return output", "when": {"construct": "amiRNA"}}, {"id": "syntasirna_json", "kind": "function", "label": "Build the syn-tasiRNA result", "module": "m5", "description": "Writes one block per gene set into the canonical JSON.", "helper": false, "sublabel": "syntasirna_json()", "signature": "syntasirna_json(group_count, groups, output_file, vector = None, cloning_oligos = None, no_offtarget = False, selected_sites = None)", "file": "src/utils.py", "lines": [942, 1012], "code": "def syntasirna_json(group_count, groups, output_file, vector=None, cloning_oligos=None, no_offtarget=False, selected_sites=None):\n    \"\"\"\n    Build syntasiRNA JSON output from pipeline results.\n\n    Args:\n        group_count (int): number of groups\n        groups (dict): pipeline result structure\n        vector (str, optional): cloning vector name\n        cloning_oligos (dict, optional): {\"forward\": ..., \"reverse\": ...}\n        no_offtarget (bool, optional): if True, off-target checking was\n            disabled, so results are labeled generically (not optimal/\n            suboptimal) and the suboptimal section is omitted\n        selected_sites (list, optional): ordered 'geneset.site' labels chosen\n            for cloning_oligos (e.g. ['1.1', '3.2', '2.1'])\n    \"\"\"\n\n    blocks = []\n    set_id = 1\n\n    for g in range(group_count):\n        group = groups[g]\n\n        section_key = \"results\" if no_offtarget else \"optimal\"\n        entry_label = \"result\" if no_offtarget else \"optimal\"\n\n        block = {\"name\": f\"Gene set {set_id}\", section_key: {}}\n        if not no_offtarget:\n            block[\"suboptimal\"] = {}\n\n        # -------------------------\n        # OPTIMAL / RESULTS\n        # -------------------------\n        for o in range(1, group.get(\"opt\", 0) + 1):\n            entry = group[\"opt_r\"][o]\n\n            hits = _extract_tf_hits(entry.get(\"tf\", \"\"))\n\n            block[section_key][f\"{entry_label} {set_id}.{o}\"] = {\n                \"syn-tasiRNA\": entry.get(\"guide\", \"\"),\n                \"TargetFinder\": hits\n            }\n\n        # -------------------------\n        # SUBOPTIMAL (only when off-target checking is enabled)\n        # -------------------------\n        if not no_offtarget:\n            for s in range(1, group.get(\"sub\", 0) + 1):\n                entry = group[\"sub_r\"][s]\n\n                hits = _extract_tf_hits(entry.get(\"tf\", \"\"))\n\n                block[\"suboptimal\"][f\"suboptimal {set_id}.{s}\"] = {\n                    \"syn-tasiRNA\": entry.get(\"guide\", \"\"),\n                    \"TargetFinder\": hits\n                }\n\n        blocks.append(block)\n        set_id += 1\n\n    output = {\"blocks\": blocks}\n    if vector:\n        output[\"vector\"] = vector\n    if cloning_oligos:\n        output[\"cloning_oligos\"] = cloning_oligos\n    if selected_sites:\n        output[\"selected_sites\"] = selected_sites\n\n    with open(output_file, \"w\") as out:\n        json.dump(output, out, indent=2)\n\n    return output", "when": {"construct": "syntasiRNA"}}, {"id": "d_json", "kind": "data", "label": "Result JSON", "module": null, "role": "result", "description": "The canonical result: guides, their targets and their off-targets.", "file": "{run}_psams.json", "format": "json"}, {"id": "write_amirna_tsv", "kind": "function", "label": "Write the table", "module": "m5", "description": "Flattens the JSON into the table meant for reading.", "helper": false, "sublabel": "write_amirna_tsv()", "signature": "write_amirna_tsv(data: dict, tsv_path) -> None", "file": "src/utils.py", "lines": [1137, 1184], "code": "def write_amirna_tsv(data: dict, tsv_path) -> None:\n    \"\"\"\n    Flatten an amiRNA JSON result (see amirna_json) into one flat,\n    human-readable TSV: one row per TargetFinder hit, carrying the guide/\n    star/cloning-oligo fields for that result plus every matched target's\n    accession/description/score/coordinates/strand/sequence/base pairing.\n    Rows keep the original result order; within a result, hits are ordered\n    by Target accession, ascending (natural sort).\n\n    Unlike syntasiRNA, amiRNA's Forward/Reverse Oligo are meaningful per\n    result (the foldback hairpin insert for that one guide, or — once a\n    vector is chosen — that guide's vector-specific cloning oligos), so\n    they're kept as regular columns rather than a separate header block.\n    \"\"\"\n    rows = []\n    hit_keys = []  # union of hit fields, in first-seen order\n\n    for section in (\"results\", \"optimal\", \"suboptimal\"):\n        entries = data.get(section)\n        if not entries:\n            continue\n        for label, entry in entries.items():\n            site = label.rsplit(\" \", 1)[-1]\n            guide = entry.get(\"amiRNA\", \"\")\n            star = entry.get(\"amiRNA*\", \"\")\n            fwd = entry.get(\"Forward Oligo\", \"\")\n            rev = entry.get(\"Reverse Oligo\", \"\")\n            hits = entry.get(\"TargetFinder\")\n            # amirna_json stores the string \"No result\" here when a cached\n            # candidate's TargetFinder JSON failed to parse — not a real hit.\n            if not isinstance(hits, list) or not hits:\n                hits = [{}]\n            hits = sorted(hits, key=lambda hit: _natural_sort_key(hit.get(\"Target accession\", \"\")))\n            for hit in hits:\n                for key in hit:\n                    if key not in hit_keys:\n                        hit_keys.append(key)\n                rows.append((section, site, guide, star, fwd, rev, hit))\n\n    # Target accession pulled out to the third column since it's the\n    # identifying field readers scan for first; the rest keep hit_keys' order.\n    other_hit_keys = [k for k in hit_keys if k != \"Target accession\"]\n    header = [\"Type\", \"Site_index\", \"Target accession\", \"amiRNA\", \"amiRNA*\", \"Forward Oligo\", \"Reverse Oligo\"] + other_hit_keys\n    with open(tsv_path, \"w\") as out:\n        out.write(\"\\t\".join(header) + \"\\n\")\n        for section, site, guide, star, fwd, rev, hit in rows:\n            values = [section, site, hit.get(\"Target accession\", \"\"), guide, star, fwd, rev] + [str(hit.get(k, \"\")) for k in other_hit_keys]\n            out.write(\"\\t\".join(values) + \"\\n\")", "when": {"construct": "amiRNA"}}, {"id": "write_syntasirna_tsv", "kind": "function", "label": "Write the table", "module": "m5", "description": "Flattens the JSON into one table covering every gene set.", "helper": false, "sublabel": "write_syntasirna_tsv()", "signature": "write_syntasirna_tsv(data: dict, tsv_path) -> None", "file": "src/utils.py", "lines": [1023, 1074], "code": "def write_syntasirna_tsv(data: dict, tsv_path) -> None:\n    \"\"\"\n    Flatten a syntasiRNA JSON result (see syntasirna_json) into one flat,\n    human-readable TSV: one row per TargetFinder hit, carrying every field\n    already present in the final JSON (gene set, site, syn-tasiRNA guide,\n    and each matched target's accession/description/score/coordinates/\n    strand/sequence/base pairing). Rows keep the original gene-set/site\n    order; within a site, hits are ordered by Target accession, ascending\n    (natural sort).\n\n    Replaces the old per-site optimal/suboptimal TSVs: their Oligo1/Oligo2\n    columns didn't apply to syntasiRNA, since cloning oligos combine several\n    *chosen* sites in a chosen order (see clone_vector.py) rather than being\n    computed per optimal site.\n\n    If `data` already carries a vector's cloning oligos (i.e. it went\n    through apply_vector_to_syntasirna_output — see clone_vector.py), that\n    info is written as a small key/value block *before* the per-hit table,\n    since it describes the whole run rather than any one row.\n    \"\"\"\n    rows = []\n    hit_keys = []  # union of hit fields, in first-seen order\n\n    for block in data.get(\"blocks\", []):\n        for section in (\"results\", \"optimal\", \"suboptimal\"):\n            entries = block.get(section)\n            if not entries:\n                continue\n            for label, entry in entries.items():\n                gene_set, site = label.rsplit(\" \", 1)[-1].split(\".\", 1)\n                guide = entry.get(\"syn-tasiRNA\", \"\")\n                hits = entry.get(\"TargetFinder\") or [{}]\n                hits = sorted(hits, key=lambda hit: _natural_sort_key(hit.get(\"Target accession\", \"\")))\n                for hit in hits:\n                    for key in hit:\n                        if key not in hit_keys:\n                            hit_keys.append(key)\n                    rows.append((gene_set, section, site, guide, hit))\n\n    header = [\"Gene_set\", \"Type\", \"Site_index\", \"syn-tasiRNA\"] + hit_keys\n    with open(tsv_path, \"w\") as out:\n        cloning_oligos = data.get(\"cloning_oligos\")\n        if cloning_oligos:\n            out.write(f\"Vector\\t{data.get('vector', '')}\\n\")\n            out.write(f\"Selected_sites\\t{','.join(data.get('selected_sites', []))}\\n\")\n            out.write(f\"Oligo_forward\\t{cloning_oligos.get('forward', '')}\\n\")\n            out.write(f\"Oligo_reverse\\t{cloning_oligos.get('reverse', '')}\\n\")\n            out.write(\"\\n\")\n        out.write(\"\\t\".join(header) + \"\\n\")\n        for gene_set, section, site, guide, hit in rows:\n            values = [gene_set, section, site, guide] + [str(hit.get(k, \"\")) for k in hit_keys]\n            out.write(\"\\t\".join(values) + \"\\n\")", "when": {"construct": "syntasiRNA"}}, {"id": "d_tsv", "kind": "data", "label": "Result table", "module": null, "role": "result", "description": "The user-facing result.", "file": "{run}_psams.tsv", "format": "tsv"}, {"id": "d_vector", "kind": "data", "label": "Cloning vector", "module": null, "role": "input", "file": "interactive prompt", "param": "-V/--vector", "description": "Chosen from a numbered list at the start of the run (select_vector()); it decides the vector-specific prefixes of the cloning oligos and the suffix of the result file name.", "when": {"construct": "amiRNA", "vector": "yes"}}, {"id": "make_amirna_oligos", "kind": "function", "label": "Cloning oligos", "module": "m5", "description": "Builds the forward and reverse oligos for the chosen vector and adds them to each result.", "helper": false, "sublabel": "make_amirna_oligos()", "signature": "make_amirna_oligos(amirna: str, amirna_star: str, vector: str)", "file": "src/oligo_design.py", "lines": [29, 35], "code": "def make_amirna_oligos(amirna: str, amirna_star: str, vector: str):\n    \"\"\"Return (forward_oligo, reverse_oligo) for an amiRNA candidate and cloning vector.\"\"\"\n    fwd_prefix, r by_gene_set[gs] = (site, label)\n    example_order = \",\".join(by_gene_set[gs][1] for gs in sorted(by_gene_set))\n\n    # Prefer a vector that doesn't need -T/--target-site for the example, so\n    # the printed command is runnable verbatim without an extra prompt.\n    example_vector = next(\n        (v for v, (_, _, ts_spacer) in SYNTASIRNA_VECTORS.items() if ts_spacer is None),\n        vectors[0],\n    )\n\n    print(\n        \"\\nTo generate the cloning oligos, edit the vector and site selection below\\n\"\n        \"(copy them from the lists above) and run:\\n\\n\"\n        f\"  python3 clone_vector.py -o {output_folder} -V \\\"{example_vector}\\\" -O \\\"{example_order}\\\"\\n\\n\"\n        \"This reuses the sites already found here — it doesn't rerun TargetFinder.\"\n    )", "when": {"construct": "syntasiRNA", "vector": "yes"}}, {"id": "d_oligos", "kind": "data", "label": "Oligos", "module": null, "role": "result", "description": "Forward and reverse oligos, in the JSON and TSV named after the vector.", "when": {"construct": "amiRNA", "vector": "yes"}}], "edges": [{"from": "d_target", "to": "parse_args", "kind": "data", "when": {"input": "fasta"}}, {"from": "d_accessions", "to": "parse_args", "kind": "data", "when": {"input": "accessions"}}, {"from": "parse_args", "to": "connect_backgrounds", "kind": "data"}, {"from": "connect_backgrounds", "to": "d_run_folder", "kind": "data"}, {"from": "d_run_folder", "to": "check_output", "kind": "data"}, {"from": "check_output", "to": "build_fg_index_fasta", "kind": "data", "when": {"input": "fasta"}}, {"from": "check_output", "to": "build_fg_index", "kind": "data", "when": {"input": "accessions"}}, {"from": "build_fg_index_fasta", "to": "d_transcripts", "kind": "data", "when": {"input": "fasta"}}, {"from": "build_fg_index", "to": "d_transcripts", "kind": "data", "when": {"input": "accessions"}}, {"from": "d_transcripts", "to": "get_tsites_bg", "kind": "data", "when": {"offtarget": "on"}}, {"from": "d_transcripts", "to
