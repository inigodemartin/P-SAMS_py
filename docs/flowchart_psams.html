<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>P-SAMS flowchart</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<style>
:root {
  --bg: #FAFBFC; --surface: #FFFFFF; --fg: #14181E; --muted: #5B646F; --line: #DBE0E6;
  --pass: #2F7DC4; --fail: #C2412B; --mark: #9A6500; --mark-soft: #FBF2DF;
  --data: #4F6477; --data-soft: #F1F4F7; --result-soft: #EAF2FA;
  --sans: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0E1116; --surface: #171C23; --fg: #E5E9EF; --muted: #97A1AE; --line: #2A313B;
  --pass: #4C9BE8; --fail: #E8604C; --mark: #F5A623; --mark-soft: #2A2418;
  --data: #9AA7B5; --data-soft: #1C222A; --result-soft: #13222F;
  color-scheme: dark;
}}
:root[data-theme="dark"] {
  --bg: #0E1116; --surface: #171C23; --fg: #E5E9EF; --muted: #97A1AE; --line: #2A313B;
  --pass: #4C9BE8; --fail: #E8604C; --mark: #F5A623; --mark-soft: #2A2418;
  --data: #9AA7B5; --data-soft: #1C222A; --result-soft: #13222F;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--sans); font-size: 16px; line-height: 1.6; }
.wrap { max-width: 1000px; margin: 0 auto; padding: 48px 20px 80px; display: flex; flex-direction: column; gap: 40px; }
.col { max-width: 64ch; display: flex; flex-direction: column; gap: 12px; }
.eyebrow { font-family: var(--mono); font-size: 12px; font-weight: 500; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); margin: 0; }
h1 { font-size: clamp(28px, 4.6vw, 40px); font-weight: 600; letter-spacing: -.02em; line-height: 1.12; margin: 0; text-wrap: balance; }
h2 { font-size: 20px; font-weight: 600; letter-spacing: -.01em; margin: 0; }
h3 { font-size: 15px; font-weight: 600; margin: 0; }
p { margin: 0; }
.lede { font-size: 17.5px; color: var(--muted); }
code { font-family: var(--mono); font-size: .88em; background: var(--surface); border: 1px solid var(--line); border-radius: 4px; padding: 1px 5px; }
section { display: flex; flex-direction: column; gap: 16px; }

/* mode selector */
.modes { display: flex; flex-direction: column; gap: 14px; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 18px 20px; }
.modes-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 10px; justify-content: space-between; }
.modes-head p { font-size: 13.5px; color: var(--muted); }
.variant { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; }
.variant > .vlabel { font-size: 13.5px; font-weight: 600; min-width: 132px; }
.variant > .vlabel span { font-family: var(--mono); font-size: 11.5px; font-weight: 400; color: var(--muted); display: block; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 7px; overflow: hidden; background: var(--bg); }
.seg button { border: 0; background: transparent; color: var(--muted); font: 500 13.5px var(--sans); padding: 6px 14px; cursor: pointer; border-right: 1px solid var(--line); }
.seg button:last-child { border-right: 0; }
.seg button[aria-pressed="true"] { background: var(--fg); color: var(--bg); }
.seg button:hover:not([aria-pressed="true"]):not(:disabled) { color: var(--fg); }
.seg button.adjusts { color: var(--muted); font-style: italic; }
.adjusted { font-size: 13px; color: var(--mark); }
.vnote { font-size: 13px; color: var(--muted); flex-basis: 100%; padding-left: 132px; }
@media (max-width: 620px) { .vnote { padding-left: 0; } .variant > .vlabel { min-width: 0; flex-basis: 100%; } }

/* toolbar */
.tools { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; font-size: 13.5px; color: var(--muted); }
.tools input[type="search"] { font: inherit; font-size: 14px; padding: 6px 10px; border: 1px solid var(--line); border-radius: 7px; background: var(--surface); color: var(--fg); width: 210px; }
.tools label { display: inline-flex; gap: 6px; align-items: center; cursor: pointer; }
.tools button { font: inherit; padding: 6px 11px; border: 1px solid var(--line); border-radius: 7px; background: var(--surface); color: var(--fg); cursor: pointer; }
.tools button:hover { border-color: var(--muted); }
.tools .grow { flex: 1; }

/* figure */
figure { margin: 0; display: flex; flex-direction: column; gap: 14px; }
.legend { display: flex; flex-wrap: wrap; gap: 8px 22px; font-size: 13px; color: var(--muted); }
.key { display: flex; align-items: center; gap: 8px; }
.chip { width: 22px; height: 11px; border-radius: 3px; border: 1.5px solid; flex: none; }
.scroller { overflow-x: auto; }
.scroller svg { display: block; width: 100%; min-width: 620px; height: auto; margin: 0 auto; }
figcaption { font-size: 14px; color: var(--muted); max-width: 64ch; }

/* svg nodes */
.node { cursor: pointer; }
.node rect, .node path.shape { transition: opacity .12s; }
.node .box { fill: var(--surface); stroke: var(--line); stroke-width: 1.5; }
.node.function .box { stroke: var(--fg); stroke-opacity: .55; }
.node.decision .box { stroke: var(--fg); stroke-width: 2; }
.node.data .box { fill: var(--data-soft); stroke: var(--data); stroke-opacity: .55; stroke-dasharray: none; }
.node.data.input .box { fill: var(--mark-soft); stroke: var(--mark); }
.node.data.result .box { fill: var(--result-soft); stroke: var(--pass); }
.node.helper .box { stroke-dasharray: 4 3; }
.node .t { font-size: 13px; font-weight: 600; fill: var(--fg); }
.node .s { font-size: 11px; fill: var(--muted); font-family: var(--mono); }
.node .d { font-size: 11.5px; fill: var(--muted); }
.node text { pointer-events: none; }
.node .tool { fill: var(--mark); font-family: var(--mono); font-size: 10.5px; }
.band .bg { fill: var(--mark-soft); stroke: var(--mark); stroke-width: 1.5; }
.band .cell { fill: var(--surface); stroke: var(--line); stroke-width: 1.2; }
.band .note { font-size: 11px; font-weight: 500; }
.band .note.fail { fill: var(--fail); }
.band .note.muted { fill: var(--muted); }
.sect text { font-family: var(--mono); font-size: 11px; font-weight: 500; letter-spacing: .09em; text-transform: uppercase; fill: var(--muted); paint-order: stroke; stroke: var(--bg); stroke-width: 6px; stroke-linejoin: round; }
.sect line { stroke: var(--line); stroke-width: 1; }
.edge path { fill: none; stroke: var(--fg); stroke-opacity: .55; stroke-width: 1.5; }
.edge.call path { stroke-dasharray: 4 3; stroke-opacity: .3; }
.edge.far path { stroke-opacity: .32; }
.edge.yes path { stroke: var(--pass); stroke-opacity: 1; }
.edge.no path { stroke: var(--fail); stroke-opacity: 1; }
.edge text { font-size: 11px; fill: var(--muted); font-family: var(--mono); paint-order: stroke; stroke: var(--bg); stroke-width: 5px; stroke-linejoin: round; }
.edge.yes text { fill: var(--pass); font-weight: 600; }
.edge.no text { fill: var(--fail); font-weight: 600; }
.dim { opacity: .18; }
.edge.lit path { stroke: var(--mark); stroke-opacity: 1; stroke-width: 2; }
.node.lit .box { stroke: var(--mark); stroke-opacity: .9; }
.sel .box { stroke: var(--mark) !important; stroke-width: 2.5 !important; }
.hit .box { stroke: var(--mark) !important; stroke-width: 2.5 !important; }

/* drawer */
.drawer { position: fixed; top: 0; right: 0; width: 400px; max-width: 92vw; height: 100%; background: var(--surface); border-left: 1px solid var(--line); box-shadow: -8px 0 28px rgba(0,0,0,.09); transform: translateX(100%); transition: transform .2s ease; overflow: auto; padding: 22px 24px 60px; z-index: 20; }
.drawer.open { transform: none; }
.drawer .close { position: absolute; top: 14px; right: 16px; border: 1px solid var(--line); background: var(--bg); color: var(--muted); border-radius: 7px; padding: 4px 10px; cursor: pointer; font: inherit; font-size: 13px; }
.drawer h2 { padding-right: 56px; text-wrap: balance; }
.drawer .tag { display: inline-block; font-family: var(--mono); font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); border: 1px solid var(--line); border-radius: 20px; padding: 2px 10px; margin: 8px 0 14px; }
.drawer dl { display: grid; grid-template-columns: 92px 1fr; gap: 6px 10px; margin: 0 0 4px; font-size: 14px; }
.drawer dt { color: var(--muted); }
.drawer dd { margin: 0; word-break: break-word; }
.drawer h3 { font-family: var(--mono); font-size: 11px; letter-spacing: .09em; text-transform: uppercase; color: var(--muted); font-weight: 500; margin: 18px 0 6px; }
.drawer ul { margin: 0; padding-left: 0; list-style: none; font-size: 14px; display: flex; flex-direction: column; gap: 4px; }
.drawer li a { color: var(--pass); cursor: pointer; }
.drawer li a:hover { text-decoration: underline; }
.drawer pre { font-family: var(--mono); font-size: 11.5px; line-height: 1.5; background: var(--bg); border: 1px solid var(--line); border-radius: 7px; padding: 10px 12px; overflow: auto; max-height: 340px; margin: 0; }
.drawer .muted { color: var(--muted); }
.drawer .empty { color: var(--muted); font-style: italic; }
@media (max-width: 760px) { .drawer { width: 100%; height: 72vh; top: auto; bottom: 0; border-left: 0; border-top: 1px solid var(--line); transform: translateY(100%); } .drawer.open { transform: none; } }
</style>
</head>
<body>
<div class="wrap">
  <header class="col">
    <p class="eyebrow" id="eyebrow"></p>
    <h1 id="h1"></h1>
    <p class="lede" id="lede"></p>
  </header>

  <section id="modes-section" hidden>
    <div class="modes">
      <div class="modes-head"><h2>Route</h2><p id="modes-sub"></p></div>
      <div id="variants"></div>
      <p class="adjusted" id="adjusted"></p>
    </div>
  </section>

  <section>
    <div class="tools">
      <input id="search" type="search" placeholder="Search steps  ( / )" autocomplete="off">
      <label><input id="f-helpers" type="checkbox"> plumbing</label>
      <label><input id="f-inter" type="checkbox" checked> intermediate data</label>
      <span class="grow"></span>
      <span id="count"></span>
      <button id="b-theme" title="Light / dark">◐</button>
    </div>

    <figure>
      <div class="legend" id="legend"></div>
      <div class="scroller"><svg id="svg" role="img"><g id="root"></g></svg></div>
      <figcaption id="cap"></figcaption>
    </figure>
  </section>
</div>

<div class="drawer" id="drawer"><button class="close" id="drawer-close">Close</button><div id="drawer-body"></div></div>

.", "file": "-f target.fa", "format": "fasta", "when": {"input": "fasta"}, "param": "-f/--fasta"}, {"id": "d_accessions", "kind": "data", "label": "Target accessions", "module": null, "role": "input", "description": "Transcript IDs of one registered species, comma-separated (':'-separated per gene set for syn-tasiRNA).", "file": "-a AT1G01010,...", "when": {"input": "accessions"}, "param": "-a/--accessions"}, {"id": "parse_args", "kind": "function", "label": "Argument check", "module": "m1", "description": "Rejects impossible combinations before any work starts: accessions take a single species, several species need FASTA input, and -n makes screening against several species meaningless.", "helper": false, "sublabel": "parse_args()", "signature": "parse_args()", "file": "src/args_parser.py", "lines": [19, 88], "code": "def parse_args():\n\n    \"\"\"\n    Parse command-line arguments for the P-SAMS-like tool.\n    \"\"\"\n    parser = argparse.ArgumentParser(description=\"Plant Small RNA Maker Suite (P-SAMS). Artificial miRNA and syn-tasiRNA designer tool.\",formatter_class=argparse.RawTextHelpFormatter)\n    parser.add_argument(\"-f\", \"--fasta\",help=\"FASTA-formatted sequence. Not used if -a is set.\")\n    parser.add_argument(\"-a\", \"--accessions\",help=\"Gene accession(s). Comma-separated list. Not used if -f is set.\")\n    parser.add_argument(\"-s\", \"--species\",help=\"Species, as registered in psams.conf. Required if -a is set.\\n\"\n             \"Accepts a comma-separated list of species to screen off-targets against several\\n\"\n             \"transcriptomes at once (e.g. -s Solanum_lycopersicum,Capsicum_annuum): a candidate\\n\"\n             \"is then only optimal when it has no off-target in any of them. Several species\\n\"\n             \"require -f/--fasta input (see -a).\")\n    parser.add_argument(\"-o\", \"--output_path\",default=\".\",help=\"Output folder path. If -r/--run_name is not set, \"\n             \"the last path component doubles
